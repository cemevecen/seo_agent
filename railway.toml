[build]
# GitHub webhook bu dosyayı okumalı (RAILPACK fallback /health’siz kalır).
builder = "nixpacks"

# PostgreSQL volume boyutu (GB) yalnızca Railway arayüzünden ayarlanır:
# Project → Postgres servisi → Settings → Volume. Bu dosyada disk kotası tanımlanamaz.

[deploy]
# Not: Komutu tek tırnakla sarmak `${PORT:-8012}` expand'ini engeller.
startCommand = "sh -lc \"exec uvicorn backend.main:app --host 0.0.0.0 --port ${PORT:-8012}\""
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 5
# Healthcheck: /health anında döner; create_all/migration arka planda (deferred startup).
# Sheet sync sonrası büyük tablolarda yine de nefes payı bırak.
healthcheckPath = "/health"
healthcheckTimeout = 300
