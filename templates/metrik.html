{% extends "base.html" %}

{% block content %}
<style>
  .metrik-page { max-width: 100%; margin: 0 auto; padding: 0.75rem 0.5rem 2.5rem; }
  @media (min-width: 640px) { .metrik-page { padding: 1rem 0.75rem 3rem; } }
  .metrik-head {
    display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between;
    gap: 0.75rem; margin-bottom: 0.85rem;
  }
  .metrik-title { font-size: 1.15rem; font-weight: 800; color: #0f172a; letter-spacing: -0.02em; }
  html.dark .metrik-title, html.charcoal .metrik-title { color: #fafafa; }
  .metrik-sub { margin-top: 0.2rem; font-size: 12px; color: #64748b; }
  html.dark .metrik-sub, html.charcoal .metrik-sub { color: #a1a1aa; }
  .metrik-tabs {
    display: inline-flex; flex-wrap: wrap; gap: 0.35rem; padding: 0.25rem;
    border-radius: 0.85rem; background: #f1f5f9; border: 1px solid #e2e8f0;
  }
  html.dark .metrik-tabs, html.charcoal .metrik-tabs { background: #2a2a2e; border-color: #3f3f46; }
  .metrik-tab {
    border: 0; background: transparent; color: #475569; font-size: 12px; font-weight: 700;
    padding: 0.45rem 0.85rem; border-radius: 0.65rem; cursor: pointer;
  }
  .metrik-tab.is-active {
    background: #fff; color: #0f172a; box-shadow: 0 1px 2px rgba(42, 42, 46, 0.08);
  }
  html.dark .metrik-tab, html.charcoal .metrik-tab { color: #a1a1aa; }
  html.dark .metrik-tab.is-active, html.charcoal .metrik-tab.is-active {
    background: #27272a; color: #fafafa;
  }
  .metrik-kpis {
    display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0.55rem;
    margin-bottom: 0.85rem;
  }
  @media (min-width: 900px) { .metrik-kpis { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
  .metrik-kpi {
    border: 1px solid #e2e8f0; background: #fff; border-radius: 0.85rem; padding: 0.7rem 0.85rem;
  }
  html.dark .metrik-kpi, html.charcoal .metrik-kpi { border-color: #3f3f46; background: #2a2a2e; }
  .metrik-kpi-label {
    font-size: 10px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; color: #64748b;
  }
  .metrik-kpi-value {
    margin-top: 0.25rem; font-size: 1.05rem; font-weight: 800; font-variant-numeric: tabular-nums; color: #0f172a;
  }
  html.dark .metrik-kpi-value, html.charcoal .metrik-kpi-value { color: #fafafa; }
  .metrik-shell {
    border: 1px solid #e2e8f0; border-radius: 0.9rem; background: #fff; overflow: hidden;
  }
  html.dark .metrik-shell, html.charcoal .metrik-shell { border-color: #3f3f46; background: #2a2a2e; }
  .metrik-toolbar {
    display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 0.5rem;
    padding: 0.65rem 0.85rem; border-bottom: 1px solid #e2e8f0; font-size: 12px; color: #64748b;
  }
  html.dark .metrik-toolbar, html.charcoal .metrik-toolbar { border-color: #3f3f46; color: #a1a1aa; }
  .metrik-table-wrap { overflow: auto; max-height: min(72vh, 820px); }
  .metrik-table {
    width: max-content; min-width: 100%; border-collapse: separate; border-spacing: 0;
    font-size: 12px; font-variant-numeric: tabular-nums;
  }
  .metrik-table th, .metrik-table td {
    padding: 0.4rem 0.5rem; border-bottom: 1px solid #e2e8f0; text-align: right;
  }
  .metrik-table td { white-space: nowrap; }
  html.dark .metrik-table th, html.dark .metrik-table td,
  html.charcoal .metrik-table th, html.charcoal .metrik-table td { border-color: #27272a; }
  .metrik-table th {
    position: sticky; top: 0; z-index: 2; background: #2a2a2e; color: #f8fafc;
    font-weight: 700; font-size: 10px; letter-spacing: 0.01em; line-height: 1.2;
    white-space: normal; max-width: 5.25rem; min-width: 3.6rem; vertical-align: bottom;
    overflow-wrap: anywhere;
  }
  html.dark .metrik-table th, html.charcoal .metrik-table th { background: #2a2a2e; color: #fafafa; }
  .metrik-table th:first-child, .metrik-table td:first-child {
    position: sticky; left: 0; z-index: 1; text-align: left; background: #fff; font-weight: 700;
    white-space: nowrap; max-width: none; min-width: 6.5rem;
  }
  .metrik-table th:first-child { z-index: 3; background: #2a2a2e; }
  html.dark .metrik-table th:first-child, html.charcoal .metrik-table th:first-child { background: #2a2a2e; }
  html.dark .metrik-table td:first-child, html.charcoal .metrik-table td:first-child { background: #2a2a2e; }
  .metrik-table tbody tr:nth-child(even) td { background: #f8fafc; }
  .metrik-table tbody tr:nth-child(even) td:first-child { background: #f8fafc; }
  html.dark .metrik-table tbody tr:nth-child(even) td,
  html.charcoal .metrik-table tbody tr:nth-child(even) td { background: #0c0c0e; }
  html.dark .metrik-table tbody tr:nth-child(even) td:first-child,
  html.charcoal .metrik-table tbody tr:nth-child(even) td:first-child { background: #0c0c0e; }
  .metrik-table tbody tr:hover td { background: #eff6ff; }
  .metrik-table tbody tr:hover td:first-child { background: #eff6ff; }
  html.dark .metrik-table tbody tr:hover td,
  html.charcoal .metrik-table tbody tr:hover td { background: #172554; }
  html.dark .metrik-table tbody tr:hover td:first-child,
  html.charcoal .metrik-table tbody tr:hover td:first-child { background: #172554; }
  .metrik-empty, .metrik-loading {
    padding: 2rem 1rem; text-align: center; color: #64748b; font-size: 13px;
  }
</style>

<div class="metrik-page" data-header-title="X-Data · Empower Intelligence" data-page-tarama="x-data">
  <div class="metrik-head">
    <div>
      <div class="metrik-title">X-Data</div>
      <div class="metrik-sub" id="metrik-sub">Empower Intelligence scrape</div>
    </div>
    <div class="flex flex-wrap items-center gap-2">
      <span data-page-tarama-slot></span>
      <div class="metrik-tabs" id="metrik-project-tabs" role="tablist" aria-label="Project">
        <button type="button" class="metrik-tab is-active" data-project="doviz">Döviz</button>
        <button type="button" class="metrik-tab" data-project="sinemalar">Sinemalar</button>
      </div>
      <div class="metrik-tabs" id="metrik-tabs" role="tablist" aria-label="Platform">
        <button type="button" class="metrik-tab is-active" data-platform="web">Web</button>
        <button type="button" class="metrik-tab" data-platform="mweb">Mobile Web</button>
        <button type="button" class="metrik-tab" data-platform="ios">iOS</button>
        <button type="button" class="metrik-tab" data-platform="android">Android</button>
      </div>
    </div>
  </div>

  <div class="metrik-kpis" id="metrik-kpis">
    <div class="metrik-kpi"><div class="metrik-kpi-label">Satır</div><div class="metrik-kpi-value" id="kpi-rows">—</div></div>
    <div class="metrik-kpi"><div class="metrik-kpi-label">Tarih aralığı</div><div class="metrik-kpi-value" id="kpi-range">—</div></div>
    <div class="metrik-kpi"><div class="metrik-kpi-label">Sütun</div><div class="metrik-kpi-value" id="kpi-cols">—</div></div>
    <div class="metrik-kpi"><div class="metrik-kpi-label">Son güncelleme</div><div class="metrik-kpi-value" id="kpi-updated">—</div></div>
  </div>

  <div class="metrik-shell">
    <div class="metrik-toolbar">
      <div id="metrik-status">Yükleniyor…</div>
      <div id="metrik-hint"></div>
    </div>
    <div class="metrik-table-wrap" id="metrik-table-wrap">
      <div class="metrik-loading" id="metrik-loading">Veriler yükleniyor…</div>
      <table class="metrik-table" id="metrik-table" hidden>
        <thead id="metrik-thead"></thead>
        <tbody id="metrik-tbody"></tbody>
      </table>
      <div class="metrik-empty" id="metrik-empty" hidden>Bu platform için veri yok.</div>
    </div>
  </div>
</div>

<script>
(function () {
  const state = {
    project: "doviz",
    platform: "web",
    meta: null,
    cache: {},
  };

  const $ = (id) => document.getElementById(id);
  const tabs = document.querySelectorAll("#metrik-tabs .metrik-tab");
  const projectTabs = document.querySelectorAll("#metrik-project-tabs .metrik-tab");

  function labelFor(key) {
    const labels = (state.meta && state.meta.labels) || {};
    return labels[key] || key;
  }

  function columnsFor(platform) {
    const map = (state.meta && state.meta.columns_by_platform) || {};
    return map[platform] || [];
  }

  function cacheKey(platform) {
    return state.project + ":" + platform;
  }

  function fmtNum(v) {
    if (v == null || v === "") return "—";
    if (typeof v === "boolean") return v ? "1" : "0";
    if (typeof v === "string" && !v.trim()) return "—";
    const n = typeof v === "number" ? v : Number(String(v).replace(",", "."));
    if (!Number.isFinite(n)) return String(v);
    const abs = Math.abs(n);
    if (abs >= 1000) return n.toLocaleString("tr-TR", { maximumFractionDigits: 2 });
    if (abs >= 1) return n.toLocaleString("tr-TR", { maximumFractionDigits: 3 });
    return n.toLocaleString("tr-TR", { maximumFractionDigits: 4 });
  }

  function setActiveTab(platform) {
    state.platform = platform;
    tabs.forEach((btn) => {
      btn.classList.toggle("is-active", btn.getAttribute("data-platform") === platform);
    });
  }

  function setActiveProject(project) {
    state.project = project === "sinemalar" ? "sinemalar" : "doviz";
    projectTabs.forEach((btn) => {
      btn.classList.toggle("is-active", btn.getAttribute("data-project") === state.project);
    });
    // Sinemalar Datas: web + mweb; app sekmelerini gizle
    tabs.forEach((btn) => {
      const p = btn.getAttribute("data-platform");
      const appOnly = p === "ios" || p === "android";
      btn.hidden = state.project === "sinemalar" && appOnly;
    });
    if (state.project === "sinemalar" && (state.platform === "ios" || state.platform === "android")) {
      state.platform = "web";
    }
  }

  async function loadMeta() {
    const res = await fetch("/api/empower-intel/meta", { headers: { Accept: "application/json" } });
    if (!res.ok) throw new Error("meta " + res.status);
    state.meta = await res.json();
  }

  async function loadSummary() {
    const res = await fetch(
      "/api/empower-intel/summary?project=" + encodeURIComponent(state.project),
      { headers: { Accept: "application/json" } }
    );
    if (!res.ok) return null;
    return res.json();
  }

  async function loadRows(platform) {
    const ck = cacheKey(platform);
    if (state.cache[ck]) return state.cache[ck];
    const url =
      "/api/empower-intel/rows?project=" +
      encodeURIComponent(state.project) +
      "&platform=" +
      encodeURIComponent(platform) +
      "&limit=5000";
    const res = await fetch(url, { headers: { Accept: "application/json" } });
    if (!res.ok) throw new Error("rows " + res.status);
    const data = await res.json();
    state.cache[ck] = data;
    return data;
  }

  function render(platform, data, summary) {
    const rows = (data && data.rows) || [];
    const preferred = columnsFor(platform);
    let keys = preferred.slice();
    if (!keys.length && rows.length) {
      keys = Object.keys(rows[0].metrics || {});
    } else if (rows.length) {
      const present = new Set();
      rows.forEach((r) => Object.keys(r.metrics || {}).forEach((k) => present.add(k)));
      keys = preferred.filter((k) => present.has(k));
      Array.from(present).forEach((k) => {
        if (!keys.includes(k)) keys.push(k);
      });
    }

    $("kpi-rows").textContent = String(rows.length);
    if (rows.length) {
      $("kpi-range").textContent = rows[0].report_date + " → " + rows[rows.length - 1].report_date;
    } else {
      $("kpi-range").textContent = "—";
    }
    $("kpi-cols").textContent = String(keys.length);
    const platSum = ((summary && summary.platforms) || []).find((p) => p.platform === platform);
    $("kpi-updated").textContent = (platSum && platSum.updated_at)
      ? String(platSum.updated_at).replace("T", " ").slice(0, 19)
      : (rows[0] && rows[0].updated_at ? String(rows[0].updated_at).replace("T", " ").slice(0, 19) : "—");

    $("metrik-status").textContent = rows.length
      ? (state.project + " · " + platform.toUpperCase() + " · " + rows.length + " gün · " + keys.length + " metrik")
      : (state.project + " · " + platform.toUpperCase() + " · veri yok");
    $("metrik-hint").textContent = summary && summary.latest_scrape
      ? ("son scrape " + String(summary.latest_scrape).replace("T", " ").slice(0, 19))
      : "";

    const loading = $("metrik-loading");
    const table = $("metrik-table");
    const empty = $("metrik-empty");
    loading.hidden = true;

    if (!rows.length) {
      table.hidden = true;
      empty.hidden = false;
      return;
    }
    empty.hidden = true;
    table.hidden = false;

    const thead = $("metrik-thead");
    const tbody = $("metrik-tbody");
    thead.innerHTML = "<tr><th>Date</th>" + keys.map((k) => {
      const lab = labelFor(k);
      return "<th title=\"" + lab.replace(/"/g, "&quot;") + "\">" + lab + "</th>";
    }).join("") + "</tr>";

    const ordered = rows.slice().reverse();
    const frag = document.createDocumentFragment();
    ordered.forEach((r) => {
      const tr = document.createElement("tr");
      const cells = ["<td>" + (r.report_date || "") + "</td>"].concat(
        keys.map((k) => "<td>" + fmtNum((r.metrics || {})[k]) + "</td>")
      );
      tr.innerHTML = cells.join("");
      frag.appendChild(tr);
    });
    tbody.innerHTML = "";
    tbody.appendChild(frag);
  }

  async function show(platform) {
    setActiveTab(platform);
    $("metrik-loading").hidden = false;
    $("metrik-table").hidden = true;
    $("metrik-empty").hidden = true;
    $("metrik-status").textContent = "Yükleniyor…";
    try {
      const [data, summary] = await Promise.all([loadRows(platform), loadSummary()]);
      render(platform, data, summary);
      const platCount = state.project === "sinemalar" ? "web+mweb" : "4 platform";
      if (summary && summary.total_rows != null) {
        $("metrik-sub").textContent =
          "Empower Intelligence · " + state.project + " · toplam " + summary.total_rows + " satır (" + platCount + ")";
      } else {
        $("metrik-sub").textContent = "Empower Intelligence · " + state.project + "-report";
      }
    } catch (err) {
      $("metrik-loading").hidden = true;
      $("metrik-empty").hidden = false;
      $("metrik-empty").textContent = "Yüklenemedi: " + (err && err.message ? err.message : err);
      $("metrik-status").textContent = "Hata";
    }
  }

  tabs.forEach((btn) => {
    btn.addEventListener("click", () => {
      const p = btn.getAttribute("data-platform");
      if (p) show(p);
    });
  });

  projectTabs.forEach((btn) => {
    btn.addEventListener("click", () => {
      const p = btn.getAttribute("data-project");
      if (!p || p === state.project) return;
      setActiveProject(p);
      show(state.platform);
    });
  });

  loadMeta()
    .then(() => {
      setActiveProject(state.project);
      return show(state.platform);
    })
    .catch((err) => {
      $("metrik-loading").hidden = true;
      $("metrik-empty").hidden = false;
      $("metrik-empty").textContent = "Meta yüklenemedi: " + (err && err.message ? err.message : err);
    });
})();
</script>
{% endblock %}
