    animation-direction: reverse;
  }

    inset: 0.9rem;

    border-right-color: transparent;

  .metric-kpi-ss2-cmp.is-up { color: #059669; }
  .metric-kpi-ss2-cmp.is-down { color: #e11d48; }
  .metric-kpi-ss2-cmp.is-flat { color: #64748b; }

<section class="rounded-2xl border border-emerald-200 bg-white p-4 shadow-sm dark:border-emerald-900/50 dark:bg-slate-900">

        <option value="180d">Last 180 days</option>
        <option value="this_month">Bu ay</option>
        <option value="last_month">Last month</option>
        <option value="ytd">This year</option>
        <option value="1y">Last 1 year</option>
        <option value="2y">Last 2 years</option>
        <option value="3y">Last 3 years</option>
        <option value="4y">Last 4 years</option>
        <option value="5y">Last 5 years</option>
        <option value="10y">Last 10 years</option>
        <option value="last_year">Last year</option>
        <option value="last_year_h1">Last year first 6 months</option>
        <option value="last_year_h2">Last year last 6 months</option>
        <option value="all">All data</option>
      </select>
    </label>
    <label class="as-f as-f--metric">Assets
      <div class="as-metric-dd">
        <button type="button" id="as-metric-trigger" class="as-metric-trigger"
                aria-haspopup="listbox" aria-expanded="false" aria-controls="as-metric-list">
          <span id="as-metric-label" class="min-w-0 flex-1 truncate">Select</span>
          <svg class="h-3.5 w-3.5 shrink-0 opacity-60" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true"><path fill-rule="evenodd" d="M5.23 7.21a.75.75 0 011.06.02L10 10.94l3.71-3.71a.75.75 0 111.06 1.06l-4.24 4.25a.75.75 0 01-1.06 0L5.21 8.29a.75.75 0 01.02-1.08z" clip-rule="evenodd"/></svg>
        </button>
        <div id="as-metric-list" role="listbox" aria-multiselectable="true"
             class="fixed z-[10200] hidden max-h-80 overflow-auto rounded-2xl border border-slate-300 bg-white shadow-lg dark:border-zinc-600 dark:bg-zinc-950">
          <div id="as-metric-list-scroll" class="py-1"></div>
        </div>
      </div>
    </label>
    <label class="as-f as-f--sm">Time breakdown
      <select id="as-breakdown">
        <option value="day" selected>Day</option>
        <option value="week">Week</option>
        <option value="month">Month</option>
      </select>
    </label>
    <label class="as-f as-f--sm">Compare
      <select id="as-compare-mode" aria-label="Compare mode">
        <option value="">Off</option>
        <option value="previous_period">Previous period (same length)</option>
        <option value="previous_year" selected>Last year (same dates)</option>
      </select>
    </label>
    <div class="as-f-actions">
      <button id="as-run" type="button"
              class="as-f-btn border border-emerald-600 bg-emerald-600 text-white hover:bg-emerald-500 disabled:cursor-wait disabled:opacity-80">
        <span id="as-run-label">Apply</span>
      </button>
    </div>
  </div>

  <div id="as-results" class="relative z-0 mt-4 w-full min-w-0">
    <div id="as-loading" class="pointer-events-none absolute inset-0 z-20 hidden items-center justify-center rounded-xl bg-white/55 backdrop-blur-[2px] dark:bg-zinc-950/50" aria-live="polite" aria-busy="false">
      <div class="flex flex-col items-center gap-3">
        <div class="as-orbit" aria-hidden="true">
          <span class="as-orbit__ring"></span>
          <span class="as-orbit__ring as-orbit__ring--mid"></span>
          <span class="as-orbit__ring as-orbit__ring--inner"></span>
          <span class="as-orbit__core"></span>
        </div>
        <p class="text-[11px] font-semibold tracking-wide text-emerald-800 dark:text-emerald-300">Loading data…</p>
      </div>
    </div>

    <div id="as-kpi-grid" class="grid grid-cols-1 gap-3" aria-label="Asset KPI cards"></div>

    <div id="as-chart-card" class="mt-4 overflow-visible rounded-xl border border-slate-200 bg-slate-50 dark:border-zinc-800 dark:bg-zinc-950">
      <div class="flex flex-wrap items-center justify-between gap-2 border-b border-slate-100 px-3 py-2 dark:border-zinc-800">
        <div id="as-legend" class="flex flex-wrap items-center gap-3 text-[10px] font-semibold text-slate-500 dark:text-zinc-400"></div>
        <div class="ml-auto flex flex-wrap items-center justify-end gap-2">
          <div id="as-chart-height" class="pa-chart-height" role="group" aria-label="Chart height">
            <button type="button" data-chart-height="1" title="Yüksek grafik" aria-label="Yüksek grafik yüksekliği">
              <svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><rect x="3" y="2" width="10" height="12" rx="1" fill="currentColor" fill-opacity="0.32"/><path d="M4.5 11 L7 7.5 L9.5 9 L12 4.5" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
            <button type="button" data-chart-height="2" title="Orta grafik" aria-label="Orta grafik yüksekliği" class="is-active">
              <svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><rect x="3" y="4.5" width="10" height="9.5" rx="1" fill="currentColor" fill-opacity="0.32"/><path d="M4.5 11.5 L7 8.5 L9.5 10 L12 6.5" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
            <button type="button" data-chart-height="3" title="Alçak grafik" aria-label="Alçak grafik yüksekliği">
              <svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><rect x="3" y="7" width="10" height="7" rx="1" fill="currentColor" fill-opacity="0.32"/><path d="M4.5 12 L7 9.5 L9.5 10.5 L12 8" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
          </div>
          <div id="as-chart-compress" class="pa-chart-compress" role="group" aria-label="Chart vertical compress">
            <button type="button" data-chart-compress="1" title="Normal sıkıştırma" aria-label="Normal dikey sıkıştırma" class="is-active">
              <svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M5.5 3.5 L8 1.5 L10.5 3.5" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M5.5 12.5 L8 14.5 L10.5 12.5" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><rect x="3.5" y="5.5" width="9" height="5" rx="1" fill="currentColor" fill-opacity="0.28"/></svg>
            </button>
            <button type="button" data-chart-compress="2" title="Orta sıkıştırma" aria-label="Orta dikey sıkıştırma">
              <svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M5.5 4 L8 2.5 L10.5 4" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M5.5 12 L8 13.5 L10.5 12" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><rect x="3.5" y="6.5" width="9" height="3" rx="1" fill="currentColor" fill-opacity="0.28"/></svg>
            </button>
            <button type="button" data-chart-compress="3" title="Yoğun sıkıştırma" aria-label="Yoğun dikey sıkıştırma">
              <svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M5.5 4.5 L8 3.5 L10.5 4.5" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M5.5 11.5 L8 12.5 L10.5 11.5" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><rect x="3.5" y="7.5" width="9" height="1.5" rx="0.6" fill="currentColor" fill-opacity="0.35"/></svg>
            </button>
          </div>
          {{ chart_style_buttons('as-chart-style', 'data-as-chart-style', '', 'bar') }}
          <p id="as-compare-range" class="text-[10px] tabular-nums text-slate-400 dark:text-zinc-500"></p>
        </div>
      </div>
      <div id="as-chart-wrap" class="relative overflow-visible" data-chart-height="2" data-chart-compress="1">
        <svg id="as-chart" viewBox="0 0 720 260" class="block w-full max-w-none select-none" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Assets chart"></svg>
        <div id="as-tooltip" class="absolute z-40 box-border hidden w-max max-w-[min(22rem,calc(100%-1rem))] overflow-y-auto overscroll-contain rounded-xl border border-slate-200/90 bg-white/95 px-3 py-2.5 shadow-lg shadow-slate-900/10 backdrop-blur-sm dark:border-zinc-600 dark:bg-zinc-900/95" style="left:0;top:0;transform:none;pointer-events:auto">
          <p id="as-tip-title" class="sticky top-0 z-[1] break-words bg-white/95 pb-0.5 text-[11px] font-bold uppercase tracking-wide tabular-nums text-slate-600 dark:bg-zinc-900/95 dark:text-zinc-300"></p>
          <div id="as-tip-body" class="mt-1.5 space-y-0.5 text-[11px]"></div>
        </div>
      </div>
    </div>

    <div id="as-table-shell" class="rdl-shell mt-4 w-full min-w-0 rounded-xl border border-slate-200 dark:border-zinc-700" data-rdl-max-rows="20" data-rdl-max-h="4000" data-rdl-storage-key="as-table-h-v2">
      <div id="as-table-wrap" class="rdl-scroll w-full min-w-0">
        <table id="as-table" class="pa-data-table text-left text-xs">
          <thead class="sticky top-0 z-[1] bg-slate-100 text-[10px] uppercase tracking-wide text-slate-500 dark:bg-zinc-900 dark:text-zinc-400">
            <tr id="as-thead-row">
              <th class="px-2 py-2 font-bold sm:px-3">Breakdown</th>
            </tr>
          </thead>
          <tbody id="as-tbody" class="divide-y divide-slate-100 dark:divide-zinc-800"></tbody>
        </table>
      </div>
      <div class="rdl-handle" data-rdl-handle role="separator" aria-orientation="horizontal" title="Drag to adjust height"></div>
    </div>
  </div>
</section>

<script>
  window.SEO_ASSETS_PAGE = {
    series: {{ asset_series_json | safe }},
    defaults: {{ asset_defaults_json | safe }},
    categories: {{ asset_categories_json | safe }},
    dataMin: {{ (asset_data_min or '') | tojson }},
    dataMax: {{ (asset_data_max or '') | tojson }}
  };
</script>
<script src="/static/js/metric_period_compare.js?v=2"></script>
<script src="/static/js/metric_table_ux.js?v=23"></script>
<script src="/static/js/resizable_data_list.js?v=7"></script>
<script src="/static/js/pa_chart_height.js?v=13"></script>
<script src="/static/js/assets_page.js?v=15"></script>
{% endblock %}
