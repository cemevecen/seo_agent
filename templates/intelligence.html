{% extends "base.html" %}

{% block content %}
<script>
  (function () {
    try {
      var u = new URL(window.location.href);
      var qs = u.searchParams;
      qs.set("tab", "trend");
      window.location.replace("/doviz-news?" + qs.toString());
    } catch (e) {
      window.location.replace("/doviz-news?tab=trend");
    }
  })();
</script>
<p class="p-6 text-sm text-slate-500">Trend news moved to the Doviz News page. Redirecting…</p>
{% endblock %}
