{% extends "base.html" %}
{% block content %}
<style>
  .xg-page { max-width: 1500px; }
  .xg-card { border: 1px solid #e2e8f0; border-radius: .9rem; background: #fff; padding: 1rem; }
  html.dark .xg-card, html.charcoal .xg-card { background: #232327; border-color: #3f3f46; }
  .xg-card h3 { font-size: .95rem; font-weight: 700; margin: 0; }
  .xg-sub { font-size: .72rem; opacity: .65; margin-top: .15rem; }
  .xg-grid { display: grid; gap: 1rem; grid-template-columns: repeat(auto-fit, minmax(min(100%, 27rem), 1fr)); }
  .xg-table { width: 100%; border-collapse: collapse; font-size: .75rem; font-variant-numeric: tabular-nums; }
  .xg-table th { text-align: left; font-size: 10px; text-transform: uppercase; letter-spacing: .04em;
                 opacity: .6; padding: .35rem .5rem; border-bottom: 1px solid #e2e8f0; }
  html.dark .xg-table th, html.charcoal .xg-table th { border-bottom-color: #3f3f46; }
  .xg-table td { padding: .35rem .5rem; border-bottom: 1px solid #f1f5f9; }
  html.dark .xg-table td, html.charcoal .xg-table td { border-bottom-color: #36363c; }
  .xg-table td.num, .xg-table th.num { text-align: right; }
  .xg-key { max-width: 20rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  /* İçerik derinliği: yol sütunu sayısal sütunları ezmesin */
  .xg-table--depth { table-layout: fixed; width: 100%; }
  .xg-table--depth th:first-child, .xg-page-cell { width: 26rem; }
  .xg-page-cell { white-space: nowrap; overflow: hidden; word-break: normal; }
  .xg-overflow td { border-bottom: 1px solid #f1f5f9; padding-top: 0; }
  html.dark .xg-overflow td, html.charcoal .xg-overflow td { border-bottom-color: #36363c; }
  .xg-page-tail { opacity: .62; padding-left: .5rem; word-break: break-all; }
  .xg-err { font-size: .72rem; color: #b91c1c; }
  html.dark .xg-err, html.charcoal .xg-err { color: #fca5a5; }
  .xg-muted { font-size: .75rem; opacity: .6; }
  .xg-kpi { display: flex; gap: 1.1rem; flex-wrap: wrap; }
  .xg-kpi div span { display: block; font-size: 10px; text-transform: uppercase; letter-spacing: .04em; opacity: .6; }
  .xg-kpi div b { font-size: 1.05rem; font-variant-numeric: tabular-nums; }
  .xg-bar { height: .4rem; border-radius: 999px; background: #4f46e5; }
  .xg-bartrack { height: .4rem; border-radius: 999px; background: #e2e8f0; overflow: hidden; }
  html.dark .xg-bartrack, html.charcoal .xg-bartrack { background: #3f3f46; }
  .xg-toolbar { display: flex; gap: .5rem; align-items: center; flex-wrap: wrap; }
  .xg-btn { padding: .3rem .7rem; font-size: .75rem; font-weight: 600; border-radius: .5rem;
            border: 1px solid rgba(148,163,184,.45); background: transparent; color: inherit; }
  .xg-btn.is-active { background: rgba(79,70,229,.14); color: #4338ca; }
  .xg-sep { display: inline-flex; gap: .25rem; padding-right: .6rem; margin-right: .3rem;
            border-right: 1px solid rgba(148,163,184,.4); }
  .xg-pf { display: inline-block; font-size: 10px; font-weight: 700; text-transform: uppercase;
           letter-spacing: .04em; opacity: .65; margin: .6rem 0 .2rem; }
  html.dark .xg-btn.is-active, html.charcoal .xg-btn.is-active { color: #a5b4fc; }
</style>

<div class="xg-page mx-auto w-full space-y-4" data-header-title="x-ga4">
  <div class="xg-card">
    <div class="flex flex-wrap items-start justify-between gap-3">
      <div>
        <h3>x-ga4</h3>
        <!-- Yalnızca yükleme/hata durumunda dolar; normalde boş kalır -->
        <p class="xg-sub" id="xg-meta" hidden></p>
      </div>
      <div class="xg-toolbar">
        <span class="xg-sep" role="group" aria-label="Platform">
          <button type="button" class="xg-btn is-active" data-xg-profile="hepsi">Hepsi</button>
          <button type="button" class="xg-btn" data-xg-profile="web">web</button>
          <button type="button" class="xg-btn" data-xg-profile="mweb">mWeb</button>
          <button type="button" class="xg-btn" data-xg-profile="android">Android</button>
          <button type="button" class="xg-btn" data-xg-profile="ios">iOS</button>
        </span>
        <button type="button" class="xg-btn" data-xg-days="1">1 gün</button>
        <button type="button" class="xg-btn is-active" data-xg-days="7">7 gün</button>
        <button type="button" class="xg-btn" data-xg-days="28">28 gün</button>
        <button type="button" class="xg-btn" id="xg-refresh">Yenile</button>
      </div>
    </div>
  </div>

  <div id="xg-body" class="xg-grid"></div>
</div>

<script>
(function () {
  var state = { days: 7, profile: "hepsi", loading: false };

  function $(id) { return document.getElementById(id); }
  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
    });
  }
  function num(n) { return (Number(n) || 0).toLocaleString("tr-TR"); }
  function pct(n) { return ((Number(n) || 0) * 100).toFixed(3).replace(".", ",") + "%"; }
  function dur(sec) {
    var s = Number(sec) || 0;
    if (s < 60) return s.toFixed(0) + " sn";
    var m = Math.floor(s / 60);
    if (m < 60) return m + " dk " + Math.round(s % 60) + " sn";
    return Math.floor(m / 60) + " sa " + (m % 60) + " dk";
  }

  function card(title, sub, inner) {
    return '<section class="xg-card"><h3>' + esc(title) + "</h3>" +
      (sub ? '<p class="xg-sub">' + esc(sub) + "</p>" : "") +
      '<div class="mt-3">' + inner + "</div></section>";
  }
  function blockError(b) {
    return b && b.ok === false
      ? '<p class="xg-err">Alınamadı: ' + esc(b.error || "bilinmeyen hata") + "</p>"
      : null;
  }
  function empty(msg) { return '<p class="xg-muted">' + esc(msg || "Veri yok.") + "</p>"; }

  function table(headers, rows) {
    if (!rows.length) return empty();
    return '<div style="overflow-x:auto"><table class="xg-table"><thead><tr>' +
      headers.map(function (h) {
        return '<th class="' + (h.num ? "num" : "") + '">' + esc(h.label) + "</th>";
      }).join("") +
      "</tr></thead><tbody>" +
      rows.map(function (r) {
        return "<tr>" + r.map(function (c, i) {
          return '<td class="' + (headers[i].num ? "num" : "") + '">' + c + "</td>";
        }).join("") + "</tr>";
      }).join("") +
      "</tbody></table></div>";
  }

  function barRows(items, labelKey, valueKey) {
    var max = items.reduce(function (m, r) { return Math.max(m, Number(r[valueKey]) || 0); }, 0) || 1;
    return items.map(function (r) {
      var v = Number(r[valueKey]) || 0;
      return [
        '<span class="xg-key" title="' + esc(r[labelKey]) + '">' + esc(r[labelKey]) + "</span>",
        num(v),
        '<div class="xg-bartrack"><div class="xg-bar" style="width:' + (v / max * 100).toFixed(1) + '%"></div></div>'
      ];
    });
  }

  // 1 — Kullanıcı & kararlılık
  function renderUsers(b) {
    var err = blockError(b);
    if (err) return card("Kullanıcı & kararlılık", "", err);
    var rows = (b.rows || []).map(function (r) {
      return [
        esc(r.profile),
        num(r.active1DayUsers), num(r.active7DayUsers), num(r.active28DayUsers)
      ];
    });
    return card(
      "Kullanıcı",
      "DAU / WAU / MAU — doğrudan GA4 API (dün)",
      table(
        [{ label: "Profil" }, { label: "DAU", num: true }, { label: "WAU", num: true },
         { label: "MAU", num: true }],
        rows
      )
    );
  }

  // 2 — Varlık ilgisi
  function renderAssets(b) {
    var err = blockError(b);
    if (err) return card("Varlık ilgisi", "", err);
    var combined = b.combined || [];
    if (!combined.length) return card("Varlık ilgisi", "customEvent:asset_key", empty());
    var inner = table(
      [{ label: "Varlık" }, { label: "Olay", num: true }, { label: "" }],
      barRows(combined, "asset", "events")
    );
    var pp = b.per_profile || {};
    var detail = Object.keys(pp).map(function (pf) {
      var rows = pp[pf];
      if (rows && rows.undefined) {
        return "<li><b>" + esc(pf) + "</b>: <span class='xg-muted'>bu property'de " +
          esc(b.dimension || "boyut") + " tanımlı değil</span></li>";
      }
      if (!rows || rows.error) {
        return "<li><b>" + esc(pf) + "</b>: <span class='xg-err'>" +
          esc((rows && rows.error) || "veri yok") + "</span></li>";
      }
      return "<li><b>" + esc(pf) + "</b>: " +
        rows.slice(0, 4).map(function (r) { return esc(r.asset) + " " + num(r.events); }).join(" · ") +
        "</li>";
    }).join("");
    // Eksik profil toplamı sessizce düşürmemeli — açıkça yazılır
    var undef = b.undefined_profiles || [];
    var warn = undef.length
      ? '<p class="xg-err mt-2">Toplam ' + esc(undef.join(", ")) +
        " profilini içermiyor: bu property'lerde " + esc(b.dimension || "boyut") +
        " tanımlı değil, dolayısıyla gerçek ilgi bu sayılardan yüksek.</p>"
      : "";
    return card("Varlık ilgisi", "customEvent:asset_key — hangi varlığa bakılıyor",
      inner + warn + '<ul class="xg-muted mt-2" style="line-height:1.6">' + detail + "</ul>");
  }

  // 3 — Uygulama / site davranışı
  function renderBehavior(b) {
    var err = blockError(b);
    if (err) return card("Uygulama & site davranışı", "", err);
    var groups = b.groups || [];
    if (!groups.length) return card("Uygulama & site davranışı", "", empty());
    return groups.map(function (g) {
      var inner;
      if (g.undefined) {
        inner = '<p class="xg-muted">Bu property\'de ' + esc(g.dimension) + " tanımlı değil.</p>";
      } else if (g.error) {
        inner = '<p class="xg-err">Alınamadı: ' + esc(g.error) + "</p>";
      } else {
        inner = table([{ label: "Değer" }, { label: "Olay", num: true }, { label: "" }],
                      barRows(g.rows || [], "value", "events"));
      }
      return card(g.label, g.dimension, inner);
    }).join("");
  }

  // 4 — İçerik derinliği
  var PAGE_MAX = 50;

  function renderDepth(b) {
    var err = blockError(b);
    if (err) return card("İçerik derinliği", "", err);
    var rows = b.rows || [];
    if (!rows.length) return card("İçerik derinliği", "", empty());
    // Uzun yollar sayısal sütunları kenara itiyordu: hücrede en fazla 50 karakter,
    // artanı satırın hemen altındaki ek satıra taşınır (tam yol yine görünür).
    var body = rows.map(function (r) {
      var full = String(r.page || "");
      var head = full.length > PAGE_MAX ? full.slice(0, PAGE_MAX) : full;
      var tail = full.length > PAGE_MAX ? full.slice(PAGE_MAX) : "";
      var main =
        '<tr><td class="xg-page-cell" title="' + esc(full) + '">' + esc(head) + "</td>" +
        "<td>" + esc(r.profile) + "</td>" +
        '<td class="num">' + num(r.views) + "</td>" +
        '<td class="num">' + dur(r.seconds_per_view) + "</td>" +
        '<td class="num">' + num(r.new_users) + "</td></tr>";
      if (!tail) return main;
      return main +
        '<tr class="xg-overflow"><td colspan="5" class="xg-page-tail" title="' + esc(full) + '">' +
        esc(tail) + "</td></tr>";
    }).join("");
    var inner =
      '<div style="overflow-x:auto"><table class="xg-table xg-table--depth"><thead><tr>' +
        '<th>Sayfa</th><th>Profil</th><th class="num">Görüntüleme</th>' +
        '<th class="num">Görüntüleme başına süre</th><th class="num">Yeni kullanıcı</th>' +
      "</tr></thead><tbody>" + body + "</tbody></table></div>";
    return card(
      "İçerik derinliği",
      "Görüntüleme başına gerçek okuma süresi ve yeni kullanıcı — pageview'dan daha iyi bir editoryal ölçü",
      inner
    );
  }

  // 5 — Saatlik ritim
  function renderHourly(b) {
    var err = blockError(b);
    if (err) return card("Saatlik ritim", "", err);
    var series = b.series || {};
    var keys = Object.keys(series);
    if (!keys.length) return card("Saatlik ritim", "", empty());
    var inner = keys.map(function (pf) {
      var s = series[pf];
      if (s.error) return "<p class='xg-err'>" + esc(pf) + ": " + esc(s.error) + "</p>";
      var hours = s.hours || [];
      if (!hours.length) return "<p class='xg-muted'>" + esc(pf) + ": veri yok</p>";
      var max = hours.reduce(function (m, h) { return Math.max(m, h.users); }, 0) || 1;
      var bars = hours.map(function (h) {
        return '<div style="flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:2px" ' +
          'title="' + h.hour + ":00 · " + num(h.users) + ' kullanıcı">' +
          '<div style="width:100%;background:#4f46e5;border-radius:2px;height:' +
          Math.max(2, h.users / max * 46).toFixed(0) + 'px"></div>' +
          '<span style="font-size:8px;opacity:.55">' + h.hour + "</span></div>";
      }).join("");
      var otherNote = s.other_users
        ? ' <span class="xg-muted">· (other) kovası: ' + num(s.other_users) + " kullanıcı</span>"
        : "";
      return '<div class="mb-3"><p class="xg-sub"><b>' + esc(pf) + "</b>" + otherNote + "</p>" +
        '<div style="display:flex;align-items:flex-end;gap:2px;height:62px">' + bars + "</div></div>";
    }).join("");
    return card("Saatlik ritim", "hour × activeUsers — yayın saati kararı için", inner);
  }

  // 6 — Kitle
  function renderAudience(b) {
    var err = blockError(b);
    if (err) return card("Kitle", "", err);
    function sub(title, items) {
      if (!items || !items.length) return "<p class='xg-sub mt-2'><b>" + esc(title) + "</b></p>" + empty();
      return "<p class='xg-sub mt-3'><b>" + esc(title) + "</b></p>" +
        table([{ label: "" }, { label: "Kullanıcı", num: true }, { label: "" }],
              barRows(items, "label", "users"));
    }
    return card("Kitle", "İlgi alanı, demografi ve GA4 kitleleri — reklam satışı için",
      sub("İlgi alanları (brandingInterest)", b.interests) +
      sub("Yaş / cinsiyet", b.demographics) +
      sub("Tanımlı kitleler", b.audiences));
  }

  function note(msg) {
    var meta = $("xg-meta");
    if (!meta) return;
    meta.textContent = msg || "";
    meta.hidden = !msg;
  }

  // Bildirimsel kırılımlar: her biri kendi container'ı, içinde profil profil liste
  function renderBreakdown(bd) {
    var pp = bd.per_profile || {};
    var keys = Object.keys(pp);
    if (!keys.length) return "";
    var inner = keys.map(function (pf) {
      var d = pp[pf] || {};
      var head = keys.length > 1 ? '<div class="xg-pf">' + esc(pf) + "</div>" : "";
      if (d.undefined) {
        return head + '<p class="xg-muted">Bu property\'de ' + esc(bd.dimension) + " tanımlı değil.</p>";
      }
      if (d.error) return head + '<p class="xg-err">Alınamadı: ' + esc(d.error) + "</p>";
      var rows = d.rows || [];
      if (!rows.length) return head + empty();
      return head + table(
        [{ label: "Değer" }, { label: bd.metric === "sessions" ? "Oturum" : "Değer", num: true }, { label: "" }],
        barRows(rows, "value", "metric")
      );
    }).join("");
    return card(bd.label, bd.hint || bd.dimension, inner);
  }

  function render(data) {
    var body = $("xg-body");
    if (!data || data.ok === false) {
      note("Alınamadı: " + ((data && data.error) || "bilinmeyen hata"));
      body.innerHTML = "";
      return;
    }
    note("");
    var b = data.blocks || {};
    body.innerHTML = [
      renderUsers(b.user_stability || {}),
      renderAssets(b.assets || {}),
      renderDepth(b.content_depth || {}),
      renderHourly(b.hourly || {}),
      renderBehavior(b.behavior || {}),
      renderAudience(b.audience || {})
    ].concat((data.breakdowns || []).map(renderBreakdown)).join("");
  }

  function load(force) {
    if (state.loading) return;
    state.loading = true;
    note("Yükleniyor…");
    fetch("/api/x-ga4/report?days=" + state.days + "&profile=" + encodeURIComponent(state.profile) +
          (force ? "&force=true" : ""),
          { headers: { Accept: "application/json" } })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (d) { render(d); })
      .catch(function () { note("İstek başarısız."); })
      .then(function () { state.loading = false; });
  }

  function bindSwitch(attr, apply) {
    document.querySelectorAll("[" + attr + "]").forEach(function (btn) {
      btn.addEventListener("click", function () {
        if (!apply(btn.getAttribute(attr))) return;
        document.querySelectorAll("[" + attr + "]").forEach(function (b) {
          b.classList.toggle("is-active", b === btn);
        });
        load(false);
      });
    });
  }

  bindSwitch("data-xg-days", function (raw) {
    var d = Number(raw) || 7;
    if (d === state.days) return false;
    state.days = d;
    return true;
  });

  bindSwitch("data-xg-profile", function (raw) {
    var p = String(raw || "hepsi");
    if (p === state.profile) return false;
    state.profile = p;
    return true;
  });
  var rb = $("xg-refresh");
  if (rb) rb.addEventListener("click", function () { load(true); });

  load(false);
})();
</script>
{% endblock %}
