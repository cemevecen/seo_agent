{% extends "base.html" %}
{% block content %}
<style>
  .xg-page { max-width: 1600px; }
  .xg-card { border: 1px solid #e2e8f0; border-radius: .9rem; background: #fff; padding: 1rem; }
  html.dark .xg-card, html.charcoal .xg-card { background: #232327; border-color: #3f3f46; }
  .xg-card h3 { font-size: .95rem; font-weight: 700; margin: 0; }
  .xg-sub { font-size: .72rem; opacity: .65; margin-top: .15rem; }
  .xg-muted { font-size: .75rem; opacity: .6; }
  .xg-err { font-size: .72rem; color: #b91c1c; }
  html.dark .xg-err, html.charcoal .xg-err { color: #fca5a5; }

  /* Container yerleşimi: her kart içeriği bittiği yerde biter, bir sonraki
     hemen altından başlar. Grid satırları en uzun karta göre hizalayıp
     aralarda boşluk bırakıyordu; sütun akışı bunu ortadan kaldırır. */
  .xg-grid { column-width: 25rem; column-gap: 1rem; }
  .xg-grid > .xg-card {
    break-inside: avoid; -webkit-column-break-inside: avoid; page-break-inside: avoid;
    display: inline-block; width: 100%; margin: 0 0 1rem;
  }

  .xg-cardhead { display: flex; align-items: flex-start; justify-content: space-between; gap: .6rem; }
  .xg-cardbody { margin-top: .75rem; }
  .xg-cardfilter { display: inline-flex; flex-wrap: wrap; gap: .2rem; justify-content: flex-end; }
  .xg-chip { padding: .12rem .42rem; font-size: .66rem; font-weight: 600; border-radius: .4rem;
             border: 1px solid rgba(148,163,184,.42); background: transparent; color: inherit; opacity: .7; }
  .xg-chip.is-active { background: rgba(79,70,229,.14); color: #4338ca; opacity: 1; border-color: transparent; }
  html.dark .xg-chip.is-active, html.charcoal .xg-chip.is-active { color: #a5b4fc; }
  .xg-onlypf { font-size: .64rem; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; opacity: .5; }
  .xg-pf { display: block; font-size: 10px; font-weight: 700; text-transform: uppercase;
           letter-spacing: .04em; opacity: .6; margin: .7rem 0 .2rem; }
  .xg-pf:first-child { margin-top: 0; }

  .xg-toolbar { display: flex; gap: .4rem; align-items: center; flex-wrap: wrap; }
  .xg-btn { padding: .3rem .7rem; font-size: .75rem; font-weight: 600; border-radius: .5rem;
            border: 1px solid rgba(148,163,184,.45); background: transparent; color: inherit; }
  .xg-btn.is-active { background: rgba(79,70,229,.14); color: #4338ca; }
  html.dark .xg-btn.is-active, html.charcoal .xg-btn.is-active { color: #a5b4fc; }

  .xg-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
  .xg-table { width: 100%; border-collapse: collapse; font-size: .75rem;
              font-variant-numeric: tabular-nums; min-width: 20rem; }
  .xg-table th { text-align: left; font-size: 10px; text-transform: uppercase; letter-spacing: .04em;
                 opacity: .6; padding: .3rem .45rem; border-bottom: 1px solid #e2e8f0; }
  html.dark .xg-table th, html.charcoal .xg-table th { border-bottom-color: #3f3f46; }
  .xg-table td { padding: .3rem .45rem; border-bottom: 1px solid #f1f5f9; }
  html.dark .xg-table td, html.charcoal .xg-table td { border-bottom-color: #36363c; }
  .xg-table td.num, .xg-table th.num { text-align: right; white-space: nowrap; }
  .xg-key { display: block; max-width: 15rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .xg-table--depth { table-layout: fixed; min-width: 30rem; }
  .xg-table--depth th:first-child, .xg-page-cell { width: 45%; }
  .xg-page-cell { white-space: nowrap; overflow: hidden; word-break: normal; }
  .xg-overflow td { padding-top: 0; }
  .xg-page-tail { opacity: .62; word-break: break-all; }

  .xg-bartrack { height: .35rem; border-radius: 999px; background: #e2e8f0; overflow: hidden; min-width: 3rem; }
  html.dark .xg-bartrack, html.charcoal .xg-bartrack { background: #3f3f46; }
  .xg-bar { height: 100%; border-radius: 999px; background: #4f46e5; }

  /* Dar ekran: tablo yerine satır başına yığın, her hücre kendi etiketiyle */
  @media (max-width: 640px) {
    .xg-grid { column-width: auto; column-count: 1; }
    .xg-table, .xg-table--depth { min-width: 0; width: 100%; table-layout: auto; }
    .xg-table thead { display: none; }
    .xg-table tbody, .xg-table tr, .xg-table td { display: block; width: auto; }
    .xg-table tr { padding: .4rem 0; border-bottom: 1px solid #e2e8f0; }
    html.dark .xg-table tr, html.charcoal .xg-table tr { border-bottom-color: #36363c; }
    .xg-table td { border: 0; padding: .1rem; display: flex; align-items: baseline;
                   justify-content: space-between; gap: .75rem; text-align: right; }
    .xg-table td::before {
      content: attr(data-label); flex: 0 0 auto; text-align: left; opacity: .55;
      font-size: 10px; text-transform: uppercase; letter-spacing: .04em;
    }
    .xg-table td[data-label=""]::before { display: none; }
    .xg-table td[data-label=""] { display: block; text-align: left; }
    .xg-page-cell, .xg-table--depth th:first-child { width: auto; white-space: normal;
                                                     word-break: break-word; text-align: left; }
    .xg-page-cell { display: block; }
    .xg-key { max-width: none; white-space: normal; word-break: break-word; }
  }
</style>

<div class="xg-page mx-auto w-full space-y-4" data-header-title="d-lab">
  <div class="xg-card">
    <div class="flex flex-wrap items-start justify-between gap-3">
      <div>
        <h3>d-lab</h3>
        <p class="xg-sub" id="xg-meta" hidden></p>
      </div>
      <div class="xg-toolbar">
        <button type="button" class="xg-btn" data-xg-days="1">1 gün</button>
        <button type="button" class="xg-btn is-active" data-xg-days="7">7 gün</button>
        <button type="button" class="xg-btn" data-xg-days="28">28 gün</button>
        <button type="button" class="xg-btn" id="xg-refresh">Yenile</button>
      </div>
    </div>
  </div>

  <div id="xg-body" class="xg-grid"></div>
</div>

<script>
(function () {
  var state = { days: 7, loading: false };
  var CARDS = {};   // id -> { profiles: [...], selected: "hepsi"|profil, body: fn(selected) }
  var seq = 0;

  function $(id) { return document.getElementById(id); }
  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
    });
  }
  function num(n) { return (Number(n) || 0).toLocaleString("tr-TR"); }
  function dur(sec) {
    var s = Number(sec) || 0;
    if (s < 60) return s.toFixed(0) + " sn";
    var m = Math.floor(s / 60);
    if (m < 60) return m + " dk " + Math.round(s % 60) + " sn";
    return Math.floor(m / 60) + " sa " + (m % 60) + " dk";
  }
  function empty(msg) { return '<p class="xg-muted">' + esc(msg || "Veri yok.") + "</p>"; }

  function table(headers, rows) {
    if (!rows.length) return empty();
    return '<div class="xg-scroll"><table class="xg-table"><thead><tr>' +
      headers.map(function (h) {
        return '<th class="' + (h.num ? "num" : "") + '">' + esc(h.label) + "</th>";
      }).join("") +
      "</tr></thead><tbody>" +
      rows.map(function (r) {
        return "<tr>" + r.map(function (c, i) {
          var h = headers[i] || {};
          return '<td class="' + (h.num ? "num" : "") + '" data-label="' + esc(h.label || "") + '">' +
            c + "</td>";
        }).join("") + "</tr>";
      }).join("") + "</tbody></table></div>";
  }

  function barRows(items, labelKey, valueKey) {
    var max = items.reduce(function (m, r) { return Math.max(m, Number(r[valueKey]) || 0); }, 0) || 1;
    return items.map(function (r) {
      var v = Number(r[valueKey]) || 0;
      return [
        '<span class="xg-key" title="' + esc(r[labelKey]) + '">' + esc(r[labelKey]) + "</span>",
        num(v),
        '<div class="xg-bartrack"><div class="xg-bar" style="width:' + (v / max * 100).toFixed(1) + '%"></div></div>'
      ];
    });
  }

  /**
   * Container iskeleti. Filtre yalnızca GERÇEKTEN verisi olan platformları
   * listeler — boş ya da tanımsız yüzey seçenek olarak sunulmaz.
   */
  function card(opts) {
    var id = "c" + (++seq);
    CARDS[id] = { profiles: opts.profiles || [], selected: "hepsi", body: opts.body };
    var pf = opts.profiles || [];
    var right = "";
    if (pf.length > 1) {
      right = '<div class="xg-cardfilter" data-card="' + id + '">' +
        ["hepsi"].concat(pf).map(function (p, i) {
          return '<button type="button" class="xg-chip' + (i === 0 ? " is-active" : "") +
            '" data-p="' + esc(p) + '">' + esc(p === "hepsi" ? "Hepsi" : p) + "</button>";
        }).join("") + "</div>";
    } else if (pf.length === 1) {
      right = '<span class="xg-onlypf">' + esc(pf[0]) + "</span>";
    }
    return '<section class="xg-card" data-cardid="' + id + '">' +
      '<div class="xg-cardhead"><div><h3>' + esc(opts.title) + "</h3>" +
        (opts.sub ? '<p class="xg-sub">' + esc(opts.sub) + "</p>" : "") + "</div>" + right + "</div>" +
      '<div class="xg-cardbody" data-body="' + id + '"></div></section>';
  }

  function paintCard(id) {
    var c = CARDS[id];
    var host = document.querySelector('[data-body="' + id + '"]');
    if (!c || !host) return;
    host.innerHTML = c.body(c.selected);
  }
  function paintAll() { Object.keys(CARDS).forEach(paintCard); }

  /** Profil profil bölüm — «hepsi» seçiliyse hepsi, değilse yalnızca seçilen. */
  function perProfile(profiles, selected, fn) {
    var list = selected === "hepsi" ? profiles : profiles.filter(function (p) { return p === selected; });
    if (!list.length) return empty();
    return list.map(function (p) {
      return (list.length > 1 ? '<span class="xg-pf">' + esc(p) + "</span>" : "") + fn(p);
    }).join("");
  }

  // ── Bildirimsel kırılımlar ────────────────────────────────────────────────
  function breakdownCard(bd) {
    var pp = bd.per_profile || {};
    var withData = Object.keys(pp).filter(function (p) {
      return (pp[p].rows || []).length > 0;
    });
    var gaps = Object.keys(pp).filter(function (p) {
      return pp[p].undefined || pp[p].error;
    }).map(function (p) {
      return p + (pp[p].undefined ? ": tanımlı değil" : ": " + String(pp[p].error).slice(0, 60));
    });
    if (!withData.length && !gaps.length) return "";
    return card({
      title: bd.label,
      sub: bd.hint || bd.dimension,
      profiles: withData,
      body: function (sel) {
        var main = withData.length
          ? perProfile(withData, sel, function (p) {
              return table(
                [{ label: "Değer" }, { label: bd.metric === "sessions" ? "Oturum" : "Sayı", num: true },
                 { label: "" }],
                barRows(pp[p].rows, "value", "metric"));
            })
          : empty("Bu boyut hiçbir yüzeyde veri döndürmedi.");
        // Eksik yüzeyler filtreye girmez ama sessizce de yutulmaz
        return main + (gaps.length
          ? '<p class="xg-muted" style="margin-top:.5rem">Kapsam dışı — ' + esc(gaps.join(" · ")) + "</p>"
          : "");
      }
    });
  }

  // ── Kullanıcı ─────────────────────────────────────────────────────────────
  function usersCard(b) {
    if (b.ok === false) return card({ title: "Kullanıcı", profiles: [], body: function () {
      return '<p class="xg-err">Alınamadı: ' + esc(b.error) + "</p>"; } });
    var rows = (b.rows || []).filter(function (r) { return r.active1DayUsers != null; });
    if (!rows.length) return "";
    return card({
      title: "Kullanıcı", sub: "DAU / WAU / MAU (dün)",
      profiles: rows.map(function (r) { return r.profile; }),
      body: function (sel) {
        var use = sel === "hepsi" ? rows : rows.filter(function (r) { return r.profile === sel; });
        return table(
          [{ label: "Profil" }, { label: "DAU", num: true }, { label: "WAU", num: true }, { label: "MAU", num: true }],
          use.map(function (r) {
            return [esc(r.profile), num(r.active1DayUsers), num(r.active7DayUsers), num(r.active28DayUsers)];
          }));
      }
    });
  }

  // ── İçerik derinliği ──────────────────────────────────────────────────────
  var PAGE_MAX = 50;
  function depthCard(b) {
    if (b.ok === false) return card({ title: "İçerik derinliği", profiles: [], body: function () {
      return '<p class="xg-err">Alınamadı: ' + esc(b.error) + "</p>"; } });
    var rows = b.rows || [];
    if (!rows.length) return "";
    var profiles = rows.map(function (r) { return r.profile; }).filter(function (p, i, a) {
      return a.indexOf(p) === i;
    });
    return card({
      title: "İçerik derinliği",
      sub: "Görüntüleme başına gerçek okuma süresi ve yeni kullanıcı",
      profiles: profiles,
      body: function (sel) {
        var use = sel === "hepsi" ? rows : rows.filter(function (r) { return r.profile === sel; });
        if (!use.length) return empty();
        // Yol 50 karakteri aşarsa artan kısım hemen altındaki satıra taşınır
        var tb = use.map(function (r) {
          var full = String(r.page || "");
          var head = full.length > PAGE_MAX ? full.slice(0, PAGE_MAX) : full;
          var tail = full.length > PAGE_MAX ? full.slice(PAGE_MAX) : "";
          var main = '<tr><td class="xg-page-cell" data-label="Sayfa" title="' + esc(full) + '">' +
            esc(head) + "</td>" +
            '<td data-label="Profil">' + esc(r.profile) + "</td>" +
            '<td class="num" data-label="Görüntüleme">' + num(r.views) + "</td>" +
            '<td class="num" data-label="Süre">' + dur(r.seconds_per_view) + "</td>" +
            '<td class="num" data-label="Yeni">' + num(r.new_users) + "</td></tr>";
          return tail ? main +
            '<tr class="xg-overflow"><td colspan="5" class="xg-page-tail" data-label="" title="' +
            esc(full) + '">' + esc(tail) + "</td></tr>" : main;
        }).join("");
        return '<div class="xg-scroll"><table class="xg-table xg-table--depth"><thead><tr>' +
          '<th>Sayfa</th><th>Profil</th><th class="num">Görüntüleme</th>' +
          '<th class="num">Süre</th><th class="num">Yeni</th></tr></thead><tbody>' +
          tb + "</tbody></table></div>";
      }
    });
  }

  // ── Saatlik ritim ─────────────────────────────────────────────────────────
  function hourlyCard(b) {
    if (b.ok === false) return card({ title: "Saatlik ritim", profiles: [], body: function () {
      return '<p class="xg-err">Alınamadı: ' + esc(b.error) + "</p>"; } });
    var series = b.series || {};
    var profiles = Object.keys(series).filter(function (p) {
      return ((series[p] || {}).hours || []).length > 0;
    });
    if (!profiles.length) return "";
    return card({
      title: "Saatlik ritim", sub: "hour × activeUsers — yayın saati kararı için",
      profiles: profiles,
      body: function (sel) {
        return perProfile(profiles, sel, function (p) {
          var s = series[p], hours = s.hours || [];
          var max = hours.reduce(function (m, h) { return Math.max(m, h.users); }, 0) || 1;
          var bars = hours.map(function (h) {
            return '<div style="flex:1;display:flex;flex-direction:column;justify-content:flex-end;' +
              'align-items:center;gap:2px" title="' + h.hour + ":00 · " + num(h.users) + ' kullanıcı">' +
              '<div style="width:100%;background:#4f46e5;border-radius:2px;height:' +
              Math.max(2, h.users / max * 46).toFixed(0) + 'px"></div>' +
              '<span style="font-size:8px;opacity:.55">' + h.hour + "</span></div>";
          }).join("");
          return '<div style="display:flex;align-items:flex-end;gap:2px;height:62px">' + bars + "</div>" +
            (s.other_users ? '<p class="xg-muted" style="margin-top:.3rem">(other) kovası: ' +
              num(s.other_users) + " kullanıcı</p>" : "");
        });
      }
    });
  }

  // ── Kitle: her liste kendi container'ında ─────────────────────────────────
  function audienceCards(b) {
    if (b.ok === false) return card({ title: "Kitle", profiles: [], body: function () {
      return '<p class="xg-err">Alınamadı: ' + esc(b.error) + "</p>"; } });
    var defs = [
      ["İlgi alanları", "brandingInterest", b.interests],
      ["Yaş / cinsiyet", "userAgeBracket × userGender", b.demographics],
      ["Tanımlı kitleler", "audienceName", b.audiences]
    ];
    return defs.map(function (d) {
      var items = d[2] || [];
      if (!items.length) return "";
      return card({
        title: d[0], sub: d[1], profiles: [],
        body: function () {
          return table([{ label: "" }, { label: "Kullanıcı", num: true }, { label: "" }],
                       barRows(items, "label", "users"));
        }
      });
    }).join("");
  }

  function note(msg) {
    var meta = $("xg-meta");
    if (!meta) return;
    meta.textContent = msg || "";
    meta.hidden = !msg;
  }

  function render(data) {
    var body = $("xg-body");
    CARDS = {}; seq = 0;
    if (!data || data.ok === false) {
      note("Alınamadı: " + ((data && data.error) || "bilinmeyen hata"));
      body.innerHTML = "";
      return;
    }
    note("");
    var b = data.blocks || {};
    body.innerHTML = [
      usersCard(b.user_stability || {}),
      depthCard(b.content_depth || {}),
      hourlyCard(b.hourly || {})
    ].concat((data.breakdowns || []).map(breakdownCard))
     .concat([audienceCards(b.audience || {})])
     .join("");
    paintAll();
  }

  function load(force) {
    if (state.loading) return;
    state.loading = true;
    note("Yükleniyor…");
    fetch("/api/x-ga4/report?days=" + state.days + (force ? "&force=true" : ""),
          { headers: { Accept: "application/json" } })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (d) { render(d); })
      .catch(function () { note("İstek başarısız."); })
      .then(function () { state.loading = false; });
  }

  // Container filtreleri: tek delege dinleyici, kart yeniden çizilir
  var host = $("xg-body");
  if (host) {
    host.addEventListener("click", function (ev) {
      var btn = ev.target && ev.target.closest && ev.target.closest("[data-p]");
      if (!btn) return;
      var wrap = btn.closest("[data-card]");
      if (!wrap) return;
      var id = wrap.getAttribute("data-card");
      var c = CARDS[id];
      var p = btn.getAttribute("data-p");
      if (!c || c.selected === p) return;
      c.selected = p;
      wrap.querySelectorAll("[data-p]").forEach(function (x) {
        x.classList.toggle("is-active", x === btn);
      });
      paintCard(id);
    });
  }

  document.querySelectorAll("[data-xg-days]").forEach(function (btn) {
    btn.addEventListener("click", function () {
      var d = Number(btn.getAttribute("data-xg-days")) || 7;
      if (d === state.days) return;
      state.days = d;
      document.querySelectorAll("[data-xg-days]").forEach(function (x) {
        x.classList.toggle("is-active", x === btn);
      });
      load(false);
    });
  });
  var rb = $("xg-refresh");
  if (rb) rb.addEventListener("click", function () { load(true); });

  load(false);
})();
</script>
{% endblock %}
