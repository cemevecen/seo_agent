{# Mağaza katalog araması + iki uygulama seçimi — /api/store/search; yalnızca /app sayfası #}
<style>
  .rt-viv-panel {
    position: relative;
    border-radius: 1.25rem;
    border: 1px solid rgb(203 213 225);
    background: rgb(255 255 255);
    padding: 0;
    box-shadow: 0 4px 24px rgba(15, 23, 42, 0.06);
    overflow: hidden;
  }
  html.dark .rt-viv-panel {
    border-color: rgb(63 63 70);
    background: rgb(24 24 27);
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.35);
  }

  .rt-viv-toolbar {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 0.5rem 0.65rem;
    margin-bottom: 0.85rem;
    padding-bottom: 0.85rem;
    border-bottom: 1px solid rgb(226 232 240);
  }
  html.dark .rt-viv-toolbar {
    border-bottom-color: rgb(63 63 70);
  }

  .rt-viv-toolbar-controls {
    display: flex;
    flex: 1 1 14rem;
    flex-wrap: wrap;
    align-items: center;
    gap: 0.5rem;
    min-width: 0;
  }

  .rt-viv-tab-hint {
    display: none;
  }

  .rt-viv-lottie {
    width: 100%;
    height: auto;
    display: block;
    overflow: visible;
  }
  .rt-viv-lottie .rt-viv-stroke {
    fill: none;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  .rt-viv-lottie .rt-viv-app-shell {
    fill: rgb(255 255 255);
    stroke: rgb(148 163 184);
    stroke-width: 1.5;
  }
  html.dark .rt-viv-lottie .rt-viv-app-shell {
    fill: rgb(39 39 42);
    stroke: rgb(113 113 122);
  }
  .rt-viv-lottie .rt-viv-app-screen {
    fill: rgb(241 245 249);
  }
  html.dark .rt-viv-lottie .rt-viv-app-screen {
    fill: rgb(24 24 27);
  }
  .rt-viv-lottie .rt-viv-app-icon {
    fill: rgb(99 102 241);
  }
  html.dark .rt-viv-lottie .rt-viv-app-icon {
    fill: rgb(129 140 248);
  }
  .rt-viv-lottie .rt-viv-app-icon-b {
    fill: rgb(14 165 233);
  }
  html.dark .rt-viv-lottie .rt-viv-app-icon-b {
    fill: rgb(56 189 248);
  }
  .rt-viv-lottie .rt-viv-star {
    fill: rgb(251 191 36);
  }
  .rt-viv-lottie .rt-viv-search-ring {
    stroke: rgb(99 102 241);
    stroke-width: 2.5;
    fill: none;
    stroke-dasharray: 44 120;
    animation: rt-viv-search-spin 2.8s linear infinite;
    transform-origin: 100px 60px;
  }
  html.dark .rt-viv-lottie .rt-viv-search-ring {
    stroke: rgb(165 180 252);
  }
  .rt-viv-lottie .rt-viv-compare-arrow {
    stroke: rgb(100 116 139);
    stroke-width: 2;
    stroke-dasharray: 6 5;
    animation: rt-viv-dash-flow 1.2s linear infinite;
  }
  html.dark .rt-viv-lottie .rt-viv-compare-arrow {
    stroke: rgb(161 161 170);
  }
  .rt-viv-lottie .rt-viv-vs-badge {
    fill: rgb(79 70 229);
  }
  html.dark .rt-viv-lottie .rt-viv-vs-badge {
    fill: rgb(99 102 241);
  }
  .rt-viv-lottie .rt-viv-vs-text {
    fill: rgb(255 255 255);
    font-size: 9px;
    font-weight: 800;
    font-family: ui-sans-serif, system-ui, sans-serif;
  }
  .rt-viv-lottie .rt-viv-phone-a {
    animation: rt-viv-float-a 2.4s ease-in-out infinite;
    transform-origin: 42px 62px;
  }
  .rt-viv-lottie .rt-viv-phone-b {
    animation: rt-viv-float-b 2.4s ease-in-out infinite;
    transform-origin: 158px 62px;
  }
  .rt-viv-lottie .rt-viv-scan-line {
    stroke: rgb(99 102 241);
    stroke-width: 1.5;
    opacity: 0;
    animation: rt-viv-scan 2.4s ease-in-out infinite;
  }
  html.dark .rt-viv-lottie .rt-viv-scan-line {
    stroke: rgb(165 180 252);
  }
  .rt-viv-lottie .rt-viv-pulse-ring {
    fill: none;
    stroke: rgb(99 102 241);
    stroke-width: 1.5;
    opacity: 0;
    animation: rt-viv-pulse-out 2.4s ease-out infinite;
  }
  html.dark .rt-viv-lottie .rt-viv-pulse-ring {
    stroke: rgb(129 140 248);
  }

  @keyframes rt-viv-float-a {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-3px); }
  }
  @keyframes rt-viv-float-b {
    0%, 100% { transform: translateY(-2px); }
    50% { transform: translateY(2px); }
  }
  @keyframes rt-viv-search-spin {
    0% { transform: rotate(0deg); stroke-dashoffset: 0; }
    100% { transform: rotate(360deg); stroke-dashoffset: -164; }
  }
  @keyframes rt-viv-dash-flow {
    0% { stroke-dashoffset: 0; }
    100% { stroke-dashoffset: -22; }
  }
  @keyframes rt-viv-scan {
    0%, 18% { opacity: 0; transform: translateY(8px); }
    35%, 55% { opacity: 0.85; transform: translateY(0); }
    72%, 100% { opacity: 0; transform: translateY(-8px); }
  }
  @keyframes rt-viv-pulse-out {
    0%, 55% { opacity: 0; transform: scale(0.85); }
    65% { opacity: 0.55; transform: scale(1); }
    100% { opacity: 0; transform: scale(1.35); }
  }
  @media (prefers-reduced-motion: reduce) {
    .rt-viv-lottie .rt-viv-phone-a,
    .rt-viv-lottie .rt-viv-phone-b,
    .rt-viv-lottie .rt-viv-search-ring,
    .rt-viv-lottie .rt-viv-compare-arrow,
    .rt-viv-lottie .rt-viv-scan-line,
    .rt-viv-lottie .rt-viv-pulse-ring {
      animation: none !important;
    }
    .rt-viv-lottie .rt-viv-scan-line { opacity: 0.35; }
    .rt-viv-lottie .rt-viv-pulse-ring { opacity: 0.2; transform: scale(1); }
  }

  .rt-viv-toolbar + [data-rt-viv-panel] {
    margin-top: 0.15rem;
  }

  .rt-viv-body {
    padding: 1.25rem 1.25rem 1.5rem;
  }
  @media (min-width: 640px) {
    .rt-viv-body { padding: 1.35rem 1.5rem 1.65rem; }
  }

  .rt-viv-tabs {
    display: inline-flex;
    flex-shrink: 0;
    flex-wrap: nowrap;
    gap: 0.25rem;
    border-radius: 0.5625rem;
    padding: 0.22rem;
    background: rgb(241 245 249);
    border: 1px solid rgb(226 232 240);
  }
  html.dark .rt-viv-tabs {
    background: rgb(39 39 42);
    border-color: rgb(63 63 70);
  }
  .rt-viv-tab {
    border: none;
    cursor: pointer;
    border-radius: 0.375rem;
    padding: 0.3125rem 0.625rem;
    font-size: clamp(0.625rem, 1.6cqi, 0.75rem);
    font-weight: 800;
    letter-spacing: 0.03em;
    text-transform: uppercase;
    color: rgb(100 116 139);
    background: transparent;
    white-space: nowrap;
  }
  html.dark .rt-viv-tab {
    color: rgb(161 161 170);
  }
  .rt-viv-tab--on {
    background: rgb(255 255 255);
    color: rgb(67 56 202);
    box-shadow: 0 1px 2px rgba(0, 0, 0, 0.06);
  }
  html.dark .rt-viv-tab--on {
    background: rgb(63 63 70);
    color: rgb(196 181 253);
  }
  .rt-viv-row {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 0.5rem;
  }
  .rt-viv-toolbar .rt-viv-input {
    min-width: 6rem;
    flex: 1 1 8rem;
    padding: 0.4375rem 0.625rem;
    font-size: clamp(0.75rem, 1.8cqi, 0.875rem);
  }
  .rt-viv-toolbar .rt-viv-select {
    padding: 0.4375rem 0.5625rem;
    font-size: clamp(0.6875rem, 1.6cqi, 0.8125rem);
  }
  .rt-viv-toolbar .rt-viv-btn {
    padding: 0.4375rem 0.75rem;
    font-size: clamp(0.6875rem, 1.6cqi, 0.8125rem);
    white-space: nowrap;
  }
  .rt-viv-input {
    min-width: 12rem;
    flex: 1 1 10rem;
    border-radius: 0.5625rem;
    border: 1px solid rgb(226 232 240);
    padding: 0.55rem 0.75rem;
    font-size: 0.9375rem;
    background: rgb(255 255 255);
    color: rgb(15 23 42);
  }
  html.dark .rt-viv-input {
    border-color: rgb(63 63 70);
    background: rgb(24 24 27);
    color: rgb(228 228 231);
  }
  .rt-viv-select {
    border-radius: 0.5625rem;
    border: 1px solid rgb(226 232 240);
    padding: 0.55rem 0.65rem;
    font-size: 0.875rem;
    background: rgb(255 255 255);
    color: rgb(15 23 42);
  }
  html.dark .rt-viv-select {
    border-color: rgb(63 63 70);
    background: rgb(24 24 27);
    color: rgb(228 228 231);
  }
  .rt-viv-btn {
    border-radius: 0.5625rem;
    border: 1px solid rgb(199 210 254);
    background: rgb(79 70 229);
    color: rgb(255 255 255);
    font-weight: 700;
    font-size: 0.875rem;
    padding: 0.55rem 1.15rem;
    cursor: pointer;
    transition: background 0.15s ease, border-color 0.15s ease;
  }
  .rt-viv-btn:hover {
    background: rgb(67 56 202);
  }
  .rt-viv-btn:disabled {
    opacity: 0.55;
    cursor: not-allowed;
  }
  html.dark .rt-viv-btn {
    border-color: rgb(99 102 241);
    background: rgb(79 70 229);
  }
  .rt-viv-results {
    margin-top: 0.75rem;
    max-height: 18rem;
    overflow-y: auto;
    border-radius: 0.5rem;
    border: 1px solid rgb(226 232 240);
    background: rgb(255 255 255);
  }
  html.dark .rt-viv-results {
    border-color: rgb(63 63 70);
    background: rgb(24 24 27);
  }
  .rt-viv-card {
    display: flex;
    gap: 0.65rem;
    align-items: flex-start;
    padding: 0.6rem 0.75rem;
    border-bottom: 1px solid rgb(241 245 249);
    text-align: left;
    width: 100%;
    cursor: pointer;
    font: inherit;
    background: transparent;
    color: inherit;
  }
  html.dark .rt-viv-card {
    border-bottom-color: rgb(63 63 70);
  }
  .rt-viv-card:last-child {
    border-bottom: none;
  }
  .rt-viv-card:hover {
    background: rgb(248 250 252);
  }
  html.dark .rt-viv-card:hover {
    background: rgb(39 39 42);
  }
  .rt-viv-card img {
    width: 2.5rem;
    height: 2.5rem;
    border-radius: 0.5rem;
    flex-shrink: 0;
    object-fit: cover;
  }
  .rt-viv-card h4 {
    margin: 0;
    font-size: 0.8rem;
    font-weight: 700;
    line-height: 1.25;
  }
  .rt-viv-card p {
    margin: 0.1rem 0 0;
    font-size: 0.7rem;
    color: rgb(100 116 139);
  }
  html.dark .rt-viv-card p {
    color: rgb(161 161 170);
  }
  .rt-viv-store-result-row {
    display: flex;
    flex-wrap: nowrap;
    align-items: stretch;
    gap: 0.35rem;
    border-bottom: 1px solid rgb(241 245 249);
    padding: 0 0.35rem 0 0;
  }
  @media (max-width: 480px) {
    .rt-viv-store-result-row {
      flex-wrap: wrap;
      padding-bottom: 0.35rem;
    }
    .rt-viv-card-storelink {
      margin-left: 2.75rem;
      white-space: normal;
    }
  }
  html.dark .rt-viv-store-result-row {
    border-bottom-color: rgb(63 63 70);
  }
  .rt-viv-store-result-row:last-child {
    border-bottom: none;
  }
  .rt-viv-store-result-row:hover .rt-viv-card-fill {
    background: rgb(248 250 252);
  }
  html.dark .rt-viv-store-result-row:hover .rt-viv-card-fill {
    background: rgb(39 39 42);
  }
  .rt-viv-card.rt-viv-card-fill {
    flex: 1 1 auto;
    min-width: 0;
    width: auto;
    border-bottom: none;
    text-align: left;
  }
  .rt-viv-card-storelink {
    flex: 0 0 auto;
    align-self: center;
    margin: 0.35rem 0;
    padding: 0.2rem 0.45rem;
    border-radius: 0.35rem;
    font-size: 0.65rem;
    font-weight: 700;
    text-decoration: none;
    color: rgb(79 70 229);
    border: 1px solid rgb(199 210 254);
    background: rgb(255 255 255);
    white-space: nowrap;
  }
  html.dark .rt-viv-card-storelink {
    color: rgb(165 180 252);
    border-color: rgb(82 82 91);
    background: rgb(24 24 27);
  }
  .rt-viv-card-storelink:hover {
    text-decoration: underline;
  }
  .rt-viv-sel {
    margin-top: 0.5rem;
    border-radius: 0.5rem;
    border: 1px dashed rgb(199 210 254);
    padding: 0.5rem 0.65rem;
    font-size: 0.75rem;
    min-height: 2.5rem;
  }
  html.dark .rt-viv-sel {
    border-color: rgba(129, 140, 248, 0.45);
    color: rgb(212 212 216);
  }
  .rt-viv-cmp-grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 1rem;
  }
  @media (min-width: 768px) {
    .rt-viv-cmp-grid {
      grid-template-columns: 1fr 1fr;
    }
  }
  .rt-viv-card.rt-viv-card--selected {
    outline: 2px solid rgb(99 102 241);
    outline-offset: -1px;
    background: rgb(238 242 255);
  }
  html.dark .rt-viv-card.rt-viv-card--selected {
    background: rgba(67, 56, 202, 0.28);
    outline-color: rgb(165, 180, 252);
  }
  html.dark .rt-viv-card.rt-viv-card--selected h4 {
    color: rgb(244, 244, 245);
  }
  html.dark .rt-viv-card.rt-viv-card--selected p {
    color: rgb(212, 212, 216);
  }
  .rt-viv-compare-wrap {
    border-radius: 0.75rem;
    border: 1px solid rgb(199 210 254);
    padding: 0.75rem 1rem;
    background: rgb(248 250 252);
  }
  html.dark .rt-viv-compare-wrap {
    border-color: rgba(129, 140, 248, 0.45);
    background: rgba(24, 24, 27, 0.96);
    color: rgb(228, 228, 231);
  }
  .rt-viv-cmp-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.8rem;
  }
  .rt-viv-cmp-table th,
  .rt-viv-cmp-table td {
    border-bottom: 1px solid rgb(226 232 240);
    padding: 0.45rem 0.5rem;
    text-align: left;
    vertical-align: top;
  }
  html.dark .rt-viv-cmp-table th,
  html.dark .rt-viv-cmp-table td {
    border-bottom-color: rgb(63, 63, 70);
  }
  .rt-viv-cmp-table th {
    font-weight: 700;
    color: rgb(71 85 105);
    width: 28%;
  }
  html.dark .rt-viv-cmp-table th {
    color: rgb(226, 232, 240);
  }
  html.dark .rt-viv-cmp-table td {
    color: rgb(228, 228, 231);
  }
  html.dark .rt-viv-cmp-table code {
    background: rgb(39, 39, 42);
    color: rgb(212, 212, 216);
    padding: 0.1rem 0.35rem;
    border-radius: 0.25rem;
    font-size: 0.78em;
  }
  .rt-viv-cmp-better {
    font-weight: 800;
    color: rgb(21 128 61);
  }
  html.dark .rt-viv-cmp-better {
    color: rgb(134 239 172);
  }
  .rt-viv-cmp-muted {
    color: rgb(100 116 139);
    font-size: 0.72rem;
  }
  html.dark .rt-viv-cmp-muted {
    color: rgb(161 161 170);
  }
  .rt-viv-ghost-btn {
    margin-top: 0.65rem;
    border-radius: 0.5rem;
    border: 1px solid rgb(203 213 225);
    background: transparent;
    padding: 0.35rem 0.75rem;
    font-size: 0.75rem;
    font-weight: 600;
    color: rgb(71 85 105);
    cursor: pointer;
  }
  html.dark .rt-viv-ghost-btn {
    border-color: rgb(82 82 91);
    color: rgb(212 212 216);
  }
  .rt-viv-ghost-btn:hover {
    background: rgb(241 245 249);
  }
  html.dark .rt-viv-ghost-btn:hover {
    background: rgb(39 39 42);
  }
  .rt-viv-compare-wrap .rt-viv-ghost-btn {
    margin-top: 0;
  }
  html.dark .rt-viv-compare-wrap .rt-viv-ghost-btn {
    background: rgb(39, 39, 42);
  }
  html.dark .rt-viv-compare-wrap .rt-viv-ghost-btn:hover {
    background: rgb(63, 63, 70);
  }
</style>

<section class="rt-viv-panel mb-4 sm:mb-5" aria-label="Store tools" data-rt-viv-root>
  <div class="rt-viv-body">
    <div class="rt-viv-toolbar">
      <div class="rt-viv-tabs" role="tablist" aria-label="Store tools">
        <button type="button" class="rt-viv-tab rt-viv-tab--on" role="tab" aria-selected="true" data-rt-viv-tab="store" onclick="rtVivSwitchTab('store')">Single app analysis</button>
        <button type="button" class="rt-viv-tab" role="tab" aria-selected="false" data-rt-viv-tab="compare" onclick="rtVivSwitchTab('compare')">Compare two apps</button>
      </div>
      <div id="rt-viv-store-toolbar" class="rt-viv-toolbar-controls">
        <input id="rt-viv-q-store" type="search" class="rt-viv-input" placeholder="e.g. sofascore, com.spotify.music" autocomplete="off" />
        <select id="rt-viv-pl-store" class="rt-viv-select" title="Platform">
          <option value="both">Both stores</option>
          <option value="google_play">Android (Play)</option>
          <option value="app_store">iOS (App Store)</option>
        </select>
        <select id="rt-viv-country-store" class="rt-viv-select" title="Country code">
          <option value="tr">Country: TR</option>
          <option value="us">Country: US</option>
          <option value="de">Country: DE</option>
          <option value="gb">Country: GB</option>
        </select>
        <select id="rt-viv-lang-store" class="rt-viv-select" title="Dil">
          <option value="tr">Dil: tr</option>
          <option value="en">Dil: en</option>
        </select>
        <button type="button" class="rt-viv-btn" id="rt-viv-btn-store" onclick="rtVivSearchStore()">Ara</button>
      </div>
    </div>

  <div data-rt-viv-panel="store">
    <p class="mt-1 text-[11px] text-slate-400 dark:text-slate-500" id="rt-viv-store-msg"></p>
    <div class="rt-viv-results hidden" id="rt-viv-store-results"></div>

    <!-- Seçili uygulama + analiz kontrolleri -->
    <div id="rt-viv-store-sel-wrap" class="hidden mt-3 rounded-xl border border-indigo-200 bg-indigo-50/60 p-3 dark:border-indigo-900/50 dark:bg-indigo-950/25">
      <div class="flex items-center gap-3">
        <img id="rt-viv-store-sel-icon" src="" alt="" class="h-10 w-10 rounded-xl object-cover shrink-0 hidden" />
        <div class="min-w-0 flex-1">
          <p id="rt-viv-store-sel-name" class="text-sm font-bold text-slate-900 dark:text-slate-100 truncate"></p>
          <p id="rt-viv-store-sel-meta" class="text-[11px] text-slate-500 dark:text-slate-400 truncate"></p>
        </div>
        <button type="button" onclick="rtVivClearStoreAnalysis()" class="text-[11px] text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 shrink-0">✕ Remove</button>
      </div>
      <div class="mt-3 flex flex-wrap items-center gap-2">
        <select id="rt-viv-store-days" class="rt-viv-select">
          <option value="7">Last 7 days</option>
          <option value="30" selected>Last 30 days</option>
          <option value="90">Last 90 days</option>
          <option value="180">Last 180 days</option>
          <option value="365">Last 1 year</option>
          <option value="730">Last 2 years</option>
        </select>
        <select id="rt-viv-store-limit" class="rt-viv-select">
          <option value="200">200 yorum</option>
          <option value="300">300 yorum</option>
          <option value="500">500 yorum</option>
          <option value="1000" selected>1000 yorum</option>
        </select>
        <button type="button" id="rt-viv-store-analyze-btn" class="rt-viv-btn" onclick="rtVivRunStoreAnalysis()">
          Fetch &amp; analyze reviews
        </button>
      </div>
      <p id="rt-viv-store-analyze-msg" class="mt-1 text-[11px] text-slate-500 dark:text-slate-400"></p>
    </div>

    <!-- Analiz sonuçları (tek uygulama) -->
    <div id="rt-viv-store-analysis-result" class="hidden mt-4"></div>
  </div>

  <div class="hidden" data-rt-viv-panel="compare">
    <p class="mb-2 text-xs text-slate-600 dark:text-slate-400">Separate search per column; click a result row to select.</p>
    <div class="rt-viv-cmp-grid">
      <div>
        <h3 class="mb-2 text-xs font-bold uppercase tracking-wider text-indigo-700 dark:text-indigo-300">App 1</h3>
        <div class="rt-viv-row">
          <input id="rt-viv-q-a" type="search" class="rt-viv-input" placeholder="Ara…" autocomplete="off" />
          <select id="rt-viv-pl-a" class="rt-viv-select">
            <option value="google_play">Android</option>
            <option value="app_store">iOS</option>
            <option value="both">Her ikisi</option>
          </select>
          <button type="button" class="rt-viv-btn" onclick="rtVivSearchCompare('a')">Ara</button>
        </div>
        <p class="mt-1 text-[11px] text-slate-400 dark:text-slate-500" id="rt-viv-msg-a"></p>
        <div class="rt-viv-sel" id="rt-viv-sel-a">Nothing selected yet — click a result row.</div>
        <div class="rt-viv-results mt-2 hidden" id="rt-viv-list-a"></div>
      </div>
      <div>
        <h3 class="mb-2 text-xs font-bold uppercase tracking-wider text-violet-700 dark:text-violet-300">App 2</h3>
        <div class="rt-viv-row">
          <input id="rt-viv-q-b" type="search" class="rt-viv-input" placeholder="Ara…" autocomplete="off" />
          <select id="rt-viv-pl-b" class="rt-viv-select">
            <option value="google_play">Android</option>
            <option value="app_store">iOS</option>
            <option value="both">Her ikisi</option>
          </select>
          <button type="button" class="rt-viv-btn" onclick="rtVivSearchCompare('b')">Ara</button>
        </div>
        <p class="mt-1 text-[11px] text-slate-400 dark:text-slate-500" id="rt-viv-msg-b"></p>
        <div class="rt-viv-sel" id="rt-viv-sel-b">Nothing selected yet — click a result row.</div>
        <div class="rt-viv-results mt-2 hidden" id="rt-viv-list-b"></div>
      </div>
    </div>
    <div id="rt-viv-compare-wrap" class="rt-viv-compare-wrap hidden" aria-live="polite">
      <div class="mb-2 flex flex-wrap items-center justify-between gap-2">
        <h4 class="text-xs font-extrabold uppercase tracking-wide text-slate-800 dark:text-slate-100">Catalog comparison</h4>
        <button type="button" class="rt-viv-ghost-btn" onclick="rtVivClearCompare()">Reset selections</button>
      </div>
      <p id="rt-viv-compare-hint" class="rt-viv-cmp-muted mb-2"></p>
      <div class="overflow-x-auto">
        <table class="rt-viv-cmp-table" id="rt-viv-compare-table" aria-label="Two-app catalog summary"></table>
      </div>
      <!-- Analiz kontrolleri (her iki uygulama selectednce görünür) -->
      <div id="rt-viv-cmp-analyze-controls" class="hidden mt-3 pt-3 border-t border-indigo-100 dark:border-indigo-900/40">
        <div class="flex flex-wrap items-center gap-2">
          <span class="text-xs font-bold text-slate-700 dark:text-slate-300">Yorum analizi:</span>
          <select id="rt-viv-cmp-days" class="rt-viv-select">
            <option value="7">Last 7 days</option>
            <option value="30" selected>Last 30 days</option>
            <option value="90">Last 90 days</option>
            <option value="180">Last 180 days</option>
            <option value="365">Last 1 year</option>
            <option value="730">Last 2 years</option>
          </select>
          <select id="rt-viv-cmp-limit" class="rt-viv-select">
            <option value="200">200 yorum</option>
            <option value="300">300 yorum</option>
            <option value="500">500 yorum</option>
            <option value="1000" selected>1000 yorum</option>
          </select>
          <button type="button" id="rt-viv-cmp-analyze-btn" class="rt-viv-btn" onclick="rtVivRunCompareAnalysis()">
            Analyze two apps
          </button>
        </div>
        <p id="rt-viv-cmp-analyze-msg" class="mt-1 text-[11px] text-slate-500 dark:text-slate-400"></p>
      </div>
    </div>
    <!-- Karşılaştırmalı analiz sonuçları -->
    <div id="rt-viv-compare-analysis-result" class="hidden mt-4"></div>
    </div>
  </div>
</section>

<script>
(function () {
  function _esc(s) {
    var d = document.createElement('div');
    d.textContent = s || '';
    return d.innerHTML;
  }

  var _rtVivLast = { a: [], b: [] };
  var _rtVivSel = { a: null, b: null };
  var _rtVivStoreLast = [];
  var _rtVivStoreSelApp = null; // selected uygulama (analiz için)
  var _rtVivReviewCache = {};

  function _rtVivReviewCardKey(prefix) {
    return (prefix || 'rv') + '-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 7);
  }

  function _rtVivDaysLabel(days) {
    var d = parseInt(days, 10) || 30;
    if (d === 7) return 'Last 7 days';
    if (d === 730) return 'Last 2 years';
    if (d === 365) return 'Last 1 year';
    if (d === 180) return 'Last 180 days';
    if (d === 90) return 'Last 90 days';
    return 'Last ' + d + ' days';
  }

  function _rtVivFmtRating(v) {
    if (v == null || v === '') return '—';
    var n = Number(v);
    if (isNaN(n)) return _esc(String(v));
    return n.toFixed(2);
  }

  function _rtVivCardInner(it) {
    var dev = it.developer ? _esc(it.developer) : '—';
    var rat = _rtVivFmtRating(it.rating);
    var rev = it.review_count != null ? String(it.review_count) : '—';
    var plat = it.platform === 'google_play' ? 'Play' : 'App Store';
    var img = it.icon
      ? '<img src="' + _esc(it.icon) + '" alt="" loading="lazy" />'
      : '<span class="inline-block h-10 w-10 shrink-0 rounded-lg bg-slate-200 dark:bg-zinc-700"></span>';
    return (
      img +
      '<div class="min-w-0 flex-1"><h4>' +
      _esc(it.name) +
      '</h4><p>' +
      dev +
      ' · ' +
      plat +
      ' · ★ ' +
      rat +
      ' · yorum: ' +
      rev +
      '</p></div>'
    );
  }

  function rtVivSwitchTab(tab) {
    var root = document.querySelector('[data-rt-viv-root]');
    if (!root) return;
    root.querySelectorAll('[data-rt-viv-tab]').forEach(function (btn) {
      var on = btn.getAttribute('data-rt-viv-tab') === tab;
      btn.classList.toggle('rt-viv-tab--on', on);
      btn.setAttribute('aria-selected', on ? 'true' : 'false');
    });
    root.querySelectorAll('[data-rt-viv-panel]').forEach(function (p) {
      p.classList.toggle('hidden', p.getAttribute('data-rt-viv-panel') !== tab);
    });
    var storeToolbar = document.getElementById('rt-viv-store-toolbar');
    if (storeToolbar) storeToolbar.classList.toggle('hidden', tab !== 'store');
  }
  window.rtVivSwitchTab = rtVivSwitchTab;

  function rtVivApplyStorePick(idx) {
    var items = _rtVivStoreLast;
    if (!items || !items[idx]) return;
    var it = items[idx];
    _rtVivStoreSelApp = it;

    // Seçim panelini göster
    var wrap = document.getElementById('rt-viv-store-sel-wrap');
    var nameEl = document.getElementById('rt-viv-store-sel-name');
    var metaEl = document.getElementById('rt-viv-store-sel-meta');
    var iconEl = document.getElementById('rt-viv-store-sel-icon');
    if (wrap) wrap.classList.remove('hidden');
    if (nameEl) nameEl.textContent = it.name || it.id;
    if (metaEl) {
      var plat = it.platform === 'google_play' ? 'Google Play' : 'App Store';
      var rat = it.rating != null ? '★ ' + Number(it.rating).toFixed(2) : '';
      var rev = it.review_count != null ? it.review_count + ' yorum' : '';
      metaEl.textContent = [it.id, plat, rat, rev].filter(Boolean).join(' · ');
    }
    if (iconEl && it.icon) {
      iconEl.src = it.icon;
      iconEl.classList.remove('hidden');
    }

    // Analiz results alanını clear
    var res = document.getElementById('rt-viv-store-analysis-result');
    if (res) { res.innerHTML = ''; res.classList.add('hidden'); }
    var msg2 = document.getElementById('rt-viv-store-analyze-msg');
    if (msg2) msg2.textContent = '';
  }
  window.rtVivApplyStorePick = rtVivApplyStorePick;

  function rtVivClearStoreAnalysis() {
    _rtVivStoreSelApp = null;
    var wrap = document.getElementById('rt-viv-store-sel-wrap');
    if (wrap) wrap.classList.add('hidden');
    var res = document.getElementById('rt-viv-store-analysis-result');
    if (res) { res.innerHTML = ''; res.classList.add('hidden'); }
  }
  window.rtVivClearStoreAnalysis = rtVivClearStoreAnalysis;

  // ── Analiz HTML üretici ────────────────────────────────────────────────────

  function _rtVivRatingBar(star, count, total) {
    var pct = total > 0 ? Math.round(count / total * 100) : 0;
    var colors = ['', 'bg-rose-500', 'bg-orange-400', 'bg-amber-400', 'bg-lime-500', 'bg-emerald-500'];
    var cls = colors[star] || 'bg-slate-400';
    return (
      '<div class="flex items-center gap-2 text-[11px]">' +
      '<span class="w-3 shrink-0 text-right font-bold text-slate-600 dark:text-slate-300">' + star + '</span>' +
      '<svg class="w-3 h-3 text-amber-400 shrink-0" viewBox="0 0 20 20" fill="currentColor"><path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"/></svg>' +
      '<div class="flex-1 h-2 rounded-full bg-slate-200 dark:bg-slate-700 overflow-hidden">' +
      '<div class="h-full rounded-full ' + cls + '" style="width:' + pct + '%"></div>' +
      '</div>' +
      '<span class="w-8 text-right tabular-nums text-slate-500 dark:text-slate-400">' + count + '</span>' +
      '<span class="w-6 text-right tabular-nums text-slate-400 dark:text-slate-500">' + pct + '%</span>' +
      '</div>'
    );
  }

  function _rtVivSentimentBar(pos, neu, neg, n) {
    var posW = n > 0 ? Math.round(pos / n * 100) : 0;
    var neuW = n > 0 ? Math.round(neu / n * 100) : 0;
    var negW = n > 0 ? Math.round(neg / n * 100) : 0;
    return (
      '<div class="space-y-1 text-[11px]">' +
      '<div class="flex h-3 overflow-hidden rounded-full">' +
      '<div class="bg-emerald-500" style="width:' + posW + '%" title="Pozitif ' + posW + '%"></div>' +
      '<div class="bg-amber-400" style="width:' + neuW + '%" title="Neutral ' + neuW + '%"></div>' +
      '<div class="bg-rose-500" style="width:' + negW + '%" title="Negatif ' + negW + '%"></div>' +
      '</div>' +
      '<div class="flex flex-wrap gap-x-3 gap-y-0.5 text-slate-500 dark:text-slate-400">' +
      '<span class="text-emerald-600 dark:text-emerald-400 font-semibold">▲ Pozitif ' + posW + '%</span>' +
      '<span class="text-amber-600 dark:text-amber-400 font-semibold">– Neutral ' + neuW + '%</span>' +
      '<span class="text-rose-600 dark:text-rose-400 font-semibold">▼ Negatif ' + negW + '%</span>' +
      '</div></div>'
    );
  }

  function _rtVivKeywordCloud(keywords) {
    if (!keywords || !keywords.length) return '<p class="text-xs text-slate-400">No keywords found.</p>';
    var max = keywords[0].count || 1;
    return keywords.slice(0, 20).map(function(kw) {
      var w = Math.max(0.75, kw.count / max);
      var sz = Math.round(10 + w * 6);
      return '<span class="inline-block px-2 py-0.5 rounded-md bg-indigo-50 dark:bg-indigo-950/40 text-indigo-800 dark:text-indigo-200 font-semibold cursor-default" style="font-size:' + sz + 'px" title="' + kw.count + ' kez">' + _esc(kw.word) + '</span>';
    }).join(' ');
  }

  function _rtVivSampleReviews(samples, cls, opts) {
    opts = opts || {};
    if (!samples || !samples.length) return '';
    cls = cls || 'bg-slate-50 dark:bg-zinc-800/50 border-slate-200 dark:border-zinc-700';
    var clamp = opts.fullText ? '' : ' line-clamp-3';
    return samples.map(function(rv) {
      var stars = ['', '★', '★★', '★★★', '★★★★', '★★★★★'][rv.score] || rv.score;
      var scoreClass = rv.score >= 4 ? 'text-emerald-600 dark:text-emerald-400' :
                       rv.score === 3 ? 'text-amber-600 dark:text-amber-400' : 'text-rose-600 dark:text-rose-400';
      var date = rv.at ? rv.at.slice(0, 10) : '';
      return (
        '<div class="rounded-lg border p-2.5 ' + cls + '">' +
        '<div class="flex items-center gap-1.5 mb-1 flex-wrap">' +
        '<span class="text-xs font-bold ' + scoreClass + '">' + stars + '</span>' +
        '<span class="text-[10px] text-slate-400 dark:text-slate-500">' + _esc(date) + '</span>' +
        (rv.author ? '<span class="text-[10px] text-slate-400 dark:text-slate-500">— ' + _esc(rv.author) + '</span>' : '') +
        (rv.version ? '<span class="text-[10px] text-slate-400 dark:text-slate-500">· v' + _esc(rv.version) + '</span>' : '') +
        '</div>' +
        '<p class="text-xs text-slate-700 dark:text-slate-300 leading-relaxed' + clamp + '">' + _esc(rv.text) + '</p>' +
        '</div>'
      );
    }).join('');
  }

  function _rtVivAllReviewsSection(cardKey, reviews) {
    if (!reviews || !reviews.length) return '';
    _rtVivReviewCache[cardKey] = reviews;
    return (
      '<div class="border-t border-slate-200 dark:border-zinc-700 pt-3">' +
      '<div class="flex flex-wrap items-center gap-2">' +
      '<button type="button" class="rt-viv-btn text-xs py-1.5 px-3" data-reviews-toggle="' + cardKey + '" onclick="rtVivToggleAllReviews(\'' + cardKey + '\')">' +
      'See all reviews (' + reviews.length + ')' +
      '</button>' +
      '<span class="text-[10px] text-slate-400 dark:text-slate-500">All analyzed reviews</span>' +
      '</div>' +
      '<div id="' + cardKey + '-reviews-all" class="hidden mt-3">' +
      '<div class="mb-2 flex flex-wrap gap-1.5" role="tablist" aria-label="Yorum filtresi">' +
      '<button type="button" class="rt-viv-review-filter rt-viv-review-filter--on rounded-md border border-slate-200 bg-white px-2 py-0.5 text-[10px] font-bold text-slate-700 dark:border-zinc-600 dark:bg-zinc-800 dark:text-slate-200" data-card="' + cardKey + '" data-filter="all" onclick="rtVivFilterAllReviews(\'' + cardKey + '\', \'all\')">All</button>' +
      '<button type="button" class="rt-viv-review-filter rounded-md border border-slate-200 bg-white px-2 py-0.5 text-[10px] font-bold text-emerald-700 dark:border-zinc-600 dark:bg-zinc-800 dark:text-emerald-300" data-card="' + cardKey + '" data-filter="positive" onclick="rtVivFilterAllReviews(\'' + cardKey + '\', \'positive\')">Olumlu (4–5★)</button>' +
      '<button type="button" class="rt-viv-review-filter rounded-md border border-slate-200 bg-white px-2 py-0.5 text-[10px] font-bold text-rose-700 dark:border-zinc-600 dark:bg-zinc-800 dark:text-rose-300" data-card="' + cardKey + '" data-filter="negative" onclick="rtVivFilterAllReviews(\'' + cardKey + '\', \'negative\')">Olumsuz (1–2★)</button>' +
      '</div>' +
      '<div id="' + cardKey + '-reviews-list" class="max-h-[28rem] overflow-y-auto space-y-2 pr-1">' +
      _rtVivRenderFilteredReviews(cardKey, 'all') +
      '</div></div></div>'
    );
  }

  function _rtVivFilterReviews(reviews, filter) {
    if (filter === 'positive') return reviews.filter(function (rv) { return (rv.score || 0) >= 4; });
    if (filter === 'negative') return reviews.filter(function (rv) { return (rv.score || 0) <= 2; });
    return reviews;
  }

  function _rtVivRenderFilteredReviews(cardKey, filter) {
    var reviews = _rtVivReviewCache[cardKey] || [];
    var filtered = _rtVivFilterReviews(reviews, filter);
    if (!filtered.length) {
      return '<p class="text-xs text-slate-400 dark:text-slate-500 py-2">No reviews in this filter.</p>';
    }
    return _rtVivSampleReviews(filtered, 'bg-slate-50 dark:bg-zinc-800/50 border-slate-200 dark:border-zinc-700', { fullText: true });
  }

  window.rtVivToggleAllReviews = function (cardKey) {
    var panel = document.getElementById(cardKey + '-reviews-all');
    var btn = document.querySelector('[data-reviews-toggle="' + cardKey + '"]');
    if (!panel || !btn) return;
    var opening = panel.classList.contains('hidden');
    panel.classList.toggle('hidden', !opening);
    var n = (_rtVivReviewCache[cardKey] || []).length;
    btn.textContent = opening ? 'Hide reviews (' + n + ')' : 'See all reviews (' + n + ')';
  };

  window.rtVivFilterAllReviews = function (cardKey, filter) {
    var list = document.getElementById(cardKey + '-reviews-list');
    if (!list) return;
    list.innerHTML = _rtVivRenderFilteredReviews(cardKey, filter);
    document.querySelectorAll('.rt-viv-review-filter[data-card="' + cardKey + '"]').forEach(function (btn) {
      var on = btn.getAttribute('data-filter') === filter;
      btn.classList.toggle('rt-viv-review-filter--on', on);
      btn.classList.toggle('ring-2', on);
      btn.classList.toggle('ring-indigo-400', on);
    });
  };

  function _rtVivBuildAnalysisCard(appName, platform, days, data, cardKey) {
    cardKey = cardKey || _rtVivReviewCardKey('rv');
    var a = data.analysis || {};
    var n = a.total_reviews || 0;
    var dist = a.rating_distribution || {};
    var sent = a.sentiment || {};
    var avg = a.average_rating || 0;
    var platLabel = platform === 'google_play' ? 'Google Play' : 'App Store';
    var reviews = data.reviews || a.all_reviews || [];
    var daysLabel = _rtVivDaysLabel(days);
    if (a.error || n === 0) {
      return (
        '<div class="rounded-xl border border-slate-200 dark:border-zinc-700 bg-white dark:bg-zinc-900 p-4">' +
        '<p class="text-xs font-bold text-slate-800 dark:text-slate-100">' + _esc(appName) + ' — ' + platLabel + '</p>' +
        '<p class="mt-2 text-sm text-slate-500 dark:text-slate-400">' + _esc(a.error || daysLabel + ' period: no reviews found.') + '</p>' +
        '</div>'
      );
    }

    return (
      '<div class="rounded-xl border border-slate-200 dark:border-zinc-700 bg-white dark:bg-zinc-900 p-4 space-y-4">' +
      '<div class="flex flex-wrap items-center justify-between gap-2">' +
      '<div>' +
      '<p class="text-sm font-extrabold text-slate-900 dark:text-slate-100">' + _esc(appName) + '</p>' +
      '<p class="text-[11px] text-slate-500 dark:text-slate-400">' + platLabel + ' · ' + daysLabel + ' · ' + n + ' yorum</p>' +
      '</div>' +
      '<div class="flex items-baseline gap-1">' +
      '<span class="text-3xl font-black text-amber-500 dark:text-amber-400">' + avg.toFixed(1) + '</span>' +
      '<span class="text-sm text-slate-400">/ 5</span>' +
      '</div>' +
      '</div>' +
      '<div>' +
      '<p class="text-[10px] font-bold uppercase tracking-wide text-slate-500 dark:text-slate-400 mb-1.5">Rating distribution</p>' +
      '<div class="space-y-1">' +
      [5,4,3,2,1].map(function(s){ return _rtVivRatingBar(s, dist[s] || 0, n); }).join('') +
      '</div></div>' +
      '<div>' +
      '<p class="text-[10px] font-bold uppercase tracking-wide text-slate-500 dark:text-slate-400 mb-1.5">Sentiment distribution</p>' +
      _rtVivSentimentBar(sent.positive || 0, sent.neutral || 0, sent.negative || 0, n) +
      '</div>' +
      '<div>' +
      '<p class="text-[10px] font-bold uppercase tracking-wide text-slate-500 dark:text-slate-400 mb-1.5">Frequent words</p>' +
      '<div class="flex flex-wrap gap-1">' + _rtVivKeywordCloud(a.top_keywords) + '</div>' +
      '</div>' +
      (a.best_samples && a.best_samples.length ?
      '<div><p class="text-[10px] font-bold uppercase tracking-wide text-emerald-600 dark:text-emerald-400 mb-1.5">Positive reviews (summary)</p>' +
      '<div class="space-y-2">' + _rtVivSampleReviews(a.best_samples, 'bg-emerald-50 dark:bg-emerald-950/30 border-emerald-200 dark:border-emerald-900/50') + '</div></div>' : '') +
      (a.worst_samples && a.worst_samples.length ?
      '<div><p class="text-[10px] font-bold uppercase tracking-wide text-rose-600 dark:text-rose-400 mb-1.5">Negative reviews (summary)</p>' +
      '<div class="space-y-2">' + _rtVivSampleReviews(a.worst_samples, 'bg-rose-50 dark:bg-rose-950/30 border-rose-200 dark:border-rose-900/50') + '</div></div>' : '') +
      _rtVivAllReviewsSection(cardKey, reviews) +
      '</div>'
    );
  }

  // ── Tek uygulama analizi ────────────────────────────────────────────────────

  function rtVivRunStoreAnalysis() {
    var it = _rtVivStoreSelApp;
    if (!it) return;
    var btn = document.getElementById('rt-viv-store-analyze-btn');
    var msg = document.getElementById('rt-viv-store-analyze-msg');
    var res = document.getElementById('rt-viv-store-analysis-result');
    var days = parseInt(document.getElementById('rt-viv-store-days').value || '30', 10);
    var limit = parseInt(document.getElementById('rt-viv-store-limit').value || '1000', 10);

    if (btn) btn.disabled = true;
    if (msg) msg.textContent = 'Fetching reviews from the store… (1000 reviews may take 1–2 min)';

    var platform = it.platform === 'app_store' ? 'app_store' : 'google_play';
    var lang = document.getElementById('rt-viv-lang-store');
    var country = document.getElementById('rt-viv-country-store');

    fetch('/api/store/review-analysis', {
      method: 'POST',
      credentials: 'same-origin',
      headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
      body: JSON.stringify({
        app_id: it.id,
        platform: platform,
        days: days,
        lang: lang ? lang.value : 'tr',
        country: country ? country.value : 'tr',
        limit: limit,
      }),
    })
    .then(function(r) { return r.json(); })
    .then(function(d) {
      if (d.detail) throw new Error(typeof d.detail === 'string' ? d.detail : JSON.stringify(d.detail));
      if (res) {
        res.innerHTML = _rtVivBuildAnalysisCard(it.name, platform, days, d, _rtVivReviewCardKey('store'));
        res.classList.remove('hidden');
      }
      if (msg) msg.textContent = d.reviews_fetched + ' yorum analiz edildi.';
    })
    .catch(function(e) {
      if (msg) msg.textContent = 'Error: ' + (e.message || 'unknown error');
    })
    .finally(function() { if (btn) btn.disabled = false; });
  }
  window.rtVivRunStoreAnalysis = rtVivRunStoreAnalysis;

  // ── Compare two appsmalı analiz ────────────────────────────────────

  function rtVivRunCompareAnalysis() {
    var selA = _rtVivSel.a;
    var selB = _rtVivSel.b;
    if (!selA || !selB) return;

    var btn = document.getElementById('rt-viv-cmp-analyze-btn');
    var msg = document.getElementById('rt-viv-cmp-analyze-msg');
    var res = document.getElementById('rt-viv-compare-analysis-result');
    var days = parseInt((document.getElementById('rt-viv-cmp-days') || {}).value || '30', 10);
    var limit = parseInt((document.getElementById('rt-viv-cmp-limit') || {}).value || '1000', 10);

    if (btn) btn.disabled = true;
    if (msg) msg.textContent = 'Fetching reviews for both apps… (1000 reviews may take 2–3 min)';

    var platA = selA.platform === 'app_store' ? 'app_store' : 'google_play';
    var platB = selB.platform === 'app_store' ? 'app_store' : 'google_play';

    Promise.all([
      fetch('/api/store/review-analysis', {
        method: 'POST', credentials: 'same-origin',
        headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
        body: JSON.stringify({ app_id: selA.id, platform: platA, days: days, lang: 'tr', country: 'tr', limit: limit }),
      }).then(function(r){ return r.json(); }),
      fetch('/api/store/review-analysis', {
        method: 'POST', credentials: 'same-origin',
        headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
        body: JSON.stringify({ app_id: selB.id, platform: platB, days: days, lang: 'tr', country: 'tr', limit: limit }),
      }).then(function(r){ return r.json(); }),
    ])
    .then(function(results) {
      var dA = results[0]; var dB = results[1];
      if (dA.detail) throw new Error('App 1: ' + (typeof dA.detail === 'string' ? dA.detail : JSON.stringify(dA.detail)));
      if (dB.detail) throw new Error('App 2: ' + (typeof dB.detail === 'string' ? dB.detail : JSON.stringify(dB.detail)));

      if (res) {
        res.innerHTML =
          '<div class="mb-3"><h4 class="text-xs font-extrabold uppercase tracking-wide text-slate-700 dark:text-slate-200">Review analysis comparison</h4></div>' +
          '<div class="grid gap-4 md:grid-cols-2">' +
          '<div>' + _rtVivBuildAnalysisCard(selA.name, platA, days, dA, _rtVivReviewCardKey('cmp-a')) + '</div>' +
          '<div>' + _rtVivBuildAnalysisCard(selB.name, platB, days, dB, _rtVivReviewCardKey('cmp-b')) + '</div>' +
          '</div>';
        res.classList.remove('hidden');
      }
      var fetchedA = dA.reviews_fetched || 0;
      var fetchedB = dB.reviews_fetched || 0;
      if (msg) msg.textContent = selA.name + ': ' + fetchedA + ' yorum · ' + selB.name + ': ' + fetchedB + ' yorum analiz edildi.';
    })
    .catch(function(e) {
      if (msg) msg.textContent = 'Error: ' + (e.message || 'unknown error');
    })
    .finally(function() { if (btn) btn.disabled = false; });
  }
  window.rtVivRunCompareAnalysis = rtVivRunCompareAnalysis;

  function rtVivSearchStore() {
    var qEl = document.getElementById('rt-viv-q-store');
    var msg = document.getElementById('rt-viv-store-msg');
    var box = document.getElementById('rt-viv-store-results');
    var btn = document.getElementById('rt-viv-btn-store');
    if (!qEl || !box) return;
    var q = (qEl.value || '').trim();
    if (q.length < 2) {
      if (msg) msg.textContent = 'En az 2 karakter girin.';
      return;
    }
    var pl = document.getElementById('rt-viv-pl-store');
    var lang = document.getElementById('rt-viv-lang-store');
    var country = document.getElementById('rt-viv-country-store');
    var platform = pl ? pl.value : 'both';
    var langV = lang ? lang.value : 'tr';
    var cc = country ? country.value : 'tr';
    if (msg) msg.textContent = 'Searching… (Play results: review counts are fetched from the store, ~15–45s)';
    if (btn) btn.disabled = true;
    var u =
      '/api/store/search?' +
      new URLSearchParams({
        q: q,
        platform: platform,
        lang: langV,
        country: cc,
        num: '20',
        offset: '0',
      }).toString();
    fetch(u, { credentials: 'same-origin', headers: { Accept: 'application/json' } })
      .then(function (r) {
        if (r.status === 401) throw new Error('Sign-in required');
        return r.json();
      })
      .then(function (d) {
        if (d.detail)
          throw new Error(typeof d.detail === 'string' ? d.detail : JSON.stringify(d.detail));
        var items = d.results || [];
        _rtVivStoreLast = items;
        if (msg) msg.textContent = items.length ? items.length + ' results — click a row to fill package/id' : 'No results';
        if (!items.length) {
          box.innerHTML =
            '<p class="p-3 text-sm text-slate-500 dark:text-slate-400">No matches found.</p>';
          box.classList.remove('hidden');
          return;
        }
        box.innerHTML = items
          .map(function (it, i) {
            return (
              '<div class="rt-viv-store-result-row">' +
              '<button type="button" class="rt-viv-card rt-viv-card-fill" onclick="rtVivApplyStorePick(' +
              i +
              ')">' +
              _rtVivCardInner(it) +
              '</button>' +
              '<a class="rt-viv-card-storelink" href="' +
              _esc(it.store_url) +
              '" target="_blank" rel="noopener noreferrer" title="Store page">Store</a>' +
              '</div>'
            );
          })
          .join('');
        box.classList.remove('hidden');
      })
      .catch(function (e) {
        if (msg) msg.textContent = e.message || 'Error';
        box.classList.add('hidden');
      })
      .finally(function () {
        if (btn) btn.disabled = false;
      });
  }
  window.rtVivSearchStore = rtVivSearchStore;

  function rtVivSearchCompare(side) {
    var qEl = document.getElementById('rt-viv-q-' + side);
    var list = document.getElementById('rt-viv-list-' + side);
    var msg = document.getElementById('rt-viv-msg-' + side);
    if (!qEl || !list) return;
    var q = (qEl.value || '').trim();
    if (q.length < 2) {
      if (msg) msg.textContent = 'En az 2 karakter.';
      return;
    }
    var pl = document.getElementById('rt-viv-pl-' + side);
    var platform = pl ? pl.value : 'google_play';
    if (msg) msg.textContent = 'Searching… (if Android is selected, review counts are fetched from the store)';
    var u =
      '/api/store/search?' +
      new URLSearchParams({
        q: q,
        platform: platform,
        lang: 'tr',
        country: 'tr',
        num: '15',
        offset: '0',
      }).toString();
    fetch(u, { credentials: 'same-origin', headers: { Accept: 'application/json' } })
      .then(function (r) {
        if (r.status === 401) throw new Error('Sign-in required');
        return r.json();
      })
      .then(function (d) {
        if (d.detail)
          throw new Error(typeof d.detail === 'string' ? d.detail : JSON.stringify(d.detail));
        var items = d.results || [];
        _rtVivLast[side] = items;
        _rtVivSel[side] = null;
        _rtVivRenderCompareTable();
        var selEl = document.getElementById('rt-viv-sel-' + side);
        if (selEl) {
          selEl.textContent = 'Nothing selected yet — click a result row.';
        }
        if (msg)
          msg.textContent = items.length ? items.length + ' results — click to select' : 'No results';
        if (!items.length) {
          list.innerHTML =
            '<p class="p-3 text-sm text-slate-500 dark:text-slate-400">No matches.</p>';
          list.classList.remove('hidden');
          return;
        }
        list.innerHTML = items
          .map(function (it, i) {
            return (
              '<button type="button" class="rt-viv-card" data-rt-viv-idx="' +
              i +
              '">' +
              _rtVivCardInner(it) +
              '</button>'
            );
          })
          .join('');
        list.classList.remove('hidden');
      })
      .catch(function (e) {
        if (msg) msg.textContent = e.message || 'Error';
        list.classList.add('hidden');
      });
  }
  window.rtVivSearchCompare = rtVivSearchCompare;

  function rtVivSelectCompare(side, idx) {
    var items = _rtVivLast[side];
    if (!items || !items[idx]) return;
    var it = items[idx];
    _rtVivSel[side] = it;
    var list = document.getElementById('rt-viv-list-' + side);
    if (list) {
      list.querySelectorAll('.rt-viv-card').forEach(function (c, j) {
        c.classList.toggle('rt-viv-card--selected', j === idx);
      });
    }
    var el = document.getElementById('rt-viv-sel-' + side);
    if (!el) return;
    var dev = it.developer ? _esc(it.developer) : '—';
    var plat = it.platform === 'google_play' ? 'Google Play' : 'App Store';
    var rat = _rtVivFmtRating(it.rating);
    var rev = it.review_count != null ? String(it.review_count) : '—';
    var icon = it.icon
      ? '<img src="' + _esc(it.icon) + '" alt="" loading="lazy" class="h-10 w-10 rounded-lg object-cover shrink-0" />'
      : '<span class="inline-block h-10 w-10 shrink-0 rounded-lg bg-slate-200 dark:bg-zinc-700"></span>';
    el.innerHTML =
      '<div class="flex items-start gap-2.5">' +
      icon +
      '<div class="min-w-0 flex-1">' +
      '<strong class="block truncate">' + _esc(it.name) + '</strong>' +
      '<span class="block text-[11px] opacity-90 truncate">' +
      dev + ' · ' + plat + ' · ★ ' + rat + ' · yorum: ' + rev +
      ' · id: <code>' + _esc(it.id) + '</code></span>' +
      '<a class="mt-1 inline-block text-indigo-600 underline dark:text-indigo-300" href="' +
      _esc(it.store_url) +
      '" target="_blank" rel="noopener noreferrer">Store page</a>' +
      '</div></div>';
    _rtVivRenderCompareTable();
  }
  window.rtVivSelectCompare = rtVivSelectCompare;

  function _rtVivNumRating(it) {
    if (!it || it.rating == null) return null;
    var n = Number(it.rating);
    return isNaN(n) ? null : n;
  }

  function _rtVivRenderCompareTable() {
    var wrap = document.getElementById('rt-viv-compare-wrap');
    var hint = document.getElementById('rt-viv-compare-hint');
    var tbl = document.getElementById('rt-viv-compare-table');
    if (!wrap || !hint || !tbl) return;
    var a = _rtVivSel.a;
    var b = _rtVivSel.b;
    if (!a && !b) {
      wrap.classList.add('hidden');
      hint.textContent = '';
      tbl.innerHTML = '';
      var acEl = document.getElementById('rt-viv-cmp-analyze-controls');
      if (acEl) acEl.classList.add('hidden');
      return;
    }
    wrap.classList.remove('hidden');
    if (!a || !b) {
      hint.textContent = !a && !b ? '' : 'Select one app from each column to compare.';
      tbl.innerHTML = '';
      var ac = document.getElementById('rt-viv-cmp-analyze-controls');
      if (ac) ac.classList.add('hidden');
      return;
    }
    hint.textContent =
      'The table below is store catalog data only (review analysis is in the section below).';
    var analyzeCtrl = document.getElementById('rt-viv-cmp-analyze-controls');
    if (analyzeCtrl) analyzeCtrl.classList.remove('hidden');
    var ra = _rtVivNumRating(a);
    var rb = _rtVivNumRating(b);
    var rClsA = '';
    var rClsB = '';
    if (ra != null && rb != null && ra !== rb) {
      rClsA = ra > rb ? ' rt-viv-cmp-better' : '';
      rClsB = rb > ra ? ' rt-viv-cmp-better' : '';
    }
    var revA = a.review_count != null ? String(a.review_count) : '—';
    var revB = b.review_count != null ? String(b.review_count) : '—';
    var revClsA = '';
    var revClsB = '';
    var na = a.review_count != null ? Number(a.review_count) : null;
    var nb = b.review_count != null ? Number(b.review_count) : null;
    if (na != null && nb != null && !isNaN(na) && !isNaN(nb) && na !== nb) {
      revClsA = na > nb ? ' rt-viv-cmp-better' : '';
      revClsB = nb > na ? ' rt-viv-cmp-better' : '';
    }
    var plat = function (it) {
      return it.platform === 'google_play' ? 'Google Play' : 'App Store';
    };
    var row = function (label, va, vb, clsA, clsB) {
      clsA = clsA || '';
      clsB = clsB || '';
      return (
        '<tr><th scope="row">' +
        _esc(label) +
        '</th><td class="' +
        clsA +
        '">' +
        va +
        '</td><td class="' +
        clsB +
        '">' +
        vb +
        '</td></tr>'
      );
    };
    tbl.innerHTML =
      '<thead><tr><th scope="col">Feature</th><th scope="col">App 1</th><th scope="col">App 2</th></tr></thead><tbody>' +
      row('App name', _esc(a.name), _esc(b.name), '', '') +
      row('Developer', a.developer ? _esc(a.developer) : '—', b.developer ? _esc(b.developer) : '—', '', '') +
      row('Platform', _esc(plat(a)), _esc(plat(b)), '', '') +
      row('Paket / track id', '<code>' + _esc(a.id) + '</code>', '<code>' + _esc(b.id) + '</code>', '', '') +
      row(
        'Catalog rating (★)',
        _rtVivFmtRating(a.rating),
        _rtVivFmtRating(b.rating),
        rClsA,
        rClsB,
      ) +
      row('Review count (if any)', revA, revB, revClsA, revClsB) +
      row(
        'Store link',
        '<a class="text-indigo-600 underline dark:text-indigo-300" href="' +
          _esc(a.store_url) +
          '" target="_blank" rel="noopener noreferrer">Open</a>',
        '<a class="text-indigo-600 underline dark:text-indigo-300" href="' +
          _esc(b.store_url) +
          '" target="_blank" rel="noopener noreferrer">Open</a>',
        '',
        '',
      ) +
      '</tbody>';
  }

  function rtVivClearCompare() {
    _rtVivSel.a = null;
    _rtVivSel.b = null;
    ['a', 'b'].forEach(function (side) {
      var el = document.getElementById('rt-viv-sel-' + side);
      if (el) {
        el.textContent = 'Nothing selected yet — click a result row.';
      }
      var list = document.getElementById('rt-viv-list-' + side);
      if (list) {
        list.querySelectorAll('.rt-viv-card').forEach(function (c) {
          c.classList.remove('rt-viv-card--selected');
        });
      }
    });
    _rtVivRenderCompareTable();
  }
  window.rtVivClearCompare = rtVivClearCompare;

  function _rtVivBindCompareClicks() {
    ['a', 'b'].forEach(function (side) {
      var list = document.getElementById('rt-viv-list-' + side);
      if (!list || list.getAttribute('data-rt-viv-bound') === '1') return;
      list.setAttribute('data-rt-viv-bound', '1');
      list.addEventListener('click', function (ev) {
        var t = ev.target && ev.target.closest ? ev.target.closest('[data-rt-viv-idx]') : null;
        if (!t || !list.contains(t)) return;
        var idx = parseInt(t.getAttribute('data-rt-viv-idx'), 10);
        if (isNaN(idx)) return;
        rtVivSelectCompare(side, idx);
      });
    });
  }

  document.addEventListener('DOMContentLoaded', function () {
    if (!document.querySelector('[data-rt-viv-root]')) return;
    _rtVivBindCompareClicks();
    var qStore = document.getElementById('rt-viv-q-store');
    if (qStore) {
      qStore.addEventListener('keydown', function (e) {
        if (e.key === 'Enter') {
          e.preventDefault();
          rtVivSearchStore();
        }
      });
    }
  });
})();
</script>
