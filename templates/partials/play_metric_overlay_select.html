{# /android ile aynı metrik kataloğu — ad-virgul Android grafik overlay #}
{% set _pmoid = play_metric_overlay_control_id|default('mz-play-metric-overlay-root') %}
<div
  class="play-metric-overlay-root relative min-w-0 text-left"
  id="{{ _pmoid }}"
  data-play-metric-overlay-root
  data-overlay-platform="android"
  data-overlay-storage-key="{{ play_metric_overlay_storage_key|default('mz-play-metric') }}"
  {% if play_metric_overlay_on_change is defined and play_metric_overlay_on_change %}
  data-overlay-on-change="{{ play_metric_overlay_on_change }}"
  {% endif %}
>
  <button
    type="button"
    data-play-metric-overlay-trigger
    class="flex w-full min-w-[10.5rem] max-w-[min(100%,16rem)] items-center gap-1.5 rounded-lg border border-indigo-300 bg-white px-2.5 py-1.5 text-[11px] font-semibold text-indigo-900 shadow-sm sm:w-auto sm:min-w-[11rem] dark:border-indigo-800 dark:bg-zinc-950 dark:text-indigo-100 midnight:border-indigo-800 midnight:bg-black midnight:text-indigo-100"
    aria-haspopup="listbox"
    aria-expanded="false"
  >
    <span data-play-metric-overlay-label class="truncate">Metric: off</span>
    <svg class="h-3 w-3 shrink-0 opacity-60" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
      <path fill-rule="evenodd" d="M5.23 7.21a.75.75 0 011.06.02L10 10.94l3.71-3.71a.75.75 0 111.06 1.06l-4.24 4.25a.75.75 0 01-1.06 0L5.21 8.29a.75.75 0 01.02-1.08z" clip-rule="evenodd" />
    </svg>
  </button>
  <div
    data-play-metric-overlay-panel
    class="play-metric-overlay-panel absolute right-0 z-[200] mt-1 hidden rounded-xl border border-indigo-200 bg-white py-1 shadow-lg dark:border-indigo-900 dark:bg-zinc-950 midnight:border-indigo-900 midnight:bg-black sm:right-0"
    role="listbox"
    aria-multiselectable="true"
  ></div>
</div>
