{% extends "base.html" %}
{% block content %}
<div class="mx-auto w-full min-w-0 max-w-[1600px] space-y-4" data-header-title="Sheet">
  <div class="rounded-2xl bg-white px-5 py-4 shadow-sm ring-1 ring-slate-200 dark:bg-zinc-900 dark:ring-0 dark:shadow-none">
    <div class="flex flex-col gap-3 lg:flex-row lg:items-start lg:justify-between">
      <div>
        <h2 class="text-lg font-bold text-slate-900 dark:text-zinc-200">Ayılma hemşireleri · aylık çizelge</h2>
        <p class="mt-0.5 max-w-3xl text-xs text-slate-500 dark:text-zinc-400">
          6+1 kadro. Gülten Çelik her gün 08–16 (fazla mesai hesabına girmez).
          Hücreye tıkla: boş → Yİ → RP → boş. Sonra «Çizelgeyi doldur».
        </p>
        <p class="mt-1 text-[11px] text-slate-400 dark:text-zinc-500">
          8 = 08–16 · 16 = 16–08 · 24 = 08–08 · Yİ / RP = izin
        </p>
      </div>
      <div class="flex flex-wrap items-end gap-2">
        <label class="text-[11px] font-semibold uppercase tracking-wide text-slate-400">
          Ay
          <input id="sh-month" type="month" class="mt-0.5 block rounded-lg border border-slate-200 bg-slate-50 px-2 py-1.5 text-xs font-semibold dark:border-transparent dark:bg-zinc-800 dark:text-zinc-200">
        </label>
        <button type="button" id="sh-generate" class="rounded-lg bg-indigo-600 px-4 py-2 text-xs font-bold text-white hover:bg-indigo-500">
          Çizelgeyi doldur
        </button>
        <button type="button" id="sh-clear-work" class="rounded-lg border border-slate-200 px-3 py-2 text-xs font-semibold text-slate-600 hover:bg-slate-50 dark:border-zinc-700 dark:text-zinc-300 dark:hover:bg-zinc-800" title="İş kodlarını sil, izinleri koru">
          Mesaiyi temizle
        </button>
      </div>
    </div>
    <div class="mt-3 flex flex-wrap gap-3" id="sh-day-only"></div>
    <label class="mt-2 inline-flex items-center gap-2 text-[11px] text-slate-500 dark:text-zinc-400">
      <input id="sh-prefer-48" type="checkbox" class="rounded border-slate-300" checked>
      24 saat sonrası mümkünse 2 gün boşluk tercih et
    </label>
  </div>

  <div id="sh-summary" class="hidden grid gap-2 sm:grid-cols-2 lg:grid-cols-4"></div>
  <div id="sh-warn" class="hidden rounded-xl border border-amber-300 bg-amber-50 px-4 py-2 text-xs text-amber-900 dark:border-amber-900/40 dark:bg-amber-950/30 dark:text-amber-200"></div>

  <div class="overflow-auto rounded-2xl bg-white shadow-sm ring-1 ring-slate-200 dark:bg-zinc-900 dark:ring-0">
    <table class="sh-table min-w-full border-collapse text-[11px]">
      <thead id="sh-head"></thead>
      <tbody id="sh-body"></tbody>
    </table>
  </div>
</div>

<style>
  .sh-table th, .sh-table td {
    border: 1px solid rgb(226 232 240);
    padding: 4px 3px;
    text-align: center;
    white-space: nowrap;
  }
  html.dark .sh-table th, html.dark .sh-table td,
  html.charcoal .sh-table th, html.charcoal .sh-table td {
    border-color: rgb(63 63 70);
  }
  .sh-table th.sh-name, .sh-table td.sh-name {
    position: sticky; left: 0; z-index: 2;
    text-align: left; padding-left: 8px; min-width: 118px;
    background: rgb(248 250 252); font-weight: 700;
  }
  html.dark .sh-table th.sh-name, html.dark .sh-table td.sh-name,
  html.charcoal .sh-table th.sh-name, html.charcoal .sh-table td.sh-name {
    background: rgb(24 24 27);
  }
  .sh-table thead th { background: rgb(241 245 249); font-weight: 700; }
  html.dark .sh-table thead th, html.charcoal .sh-table thead th { background: rgb(39 39 42); }
  .sh-wknd { background: rgb(220 252 231 / 0.55); }
  html.dark .sh-wknd, html.charcoal .sh-wknd { background: rgb(20 83 45 / 0.25); }
  .sh-leave { background: rgb(254 249 195) !important; color: rgb(133 77 14); font-weight: 800; }
  html.dark .sh-leave, html.charcoal .sh-leave { background: rgb(113 63 18 / 0.45) !important; color: rgb(253 230 138); }
  .sh-lead td.sh-name { color: rgb(67 56 202); }
  .sh-cell { cursor: pointer; min-width: 28px; }
  .sh-cell:hover { outline: 2px solid rgb(99 102 241); outline-offset: -2px; }
  .sh-tot { font-weight: 800; font-variant-numeric: tabular-nums; }
</style>

<script>
(function () {
  var meta = null;
  var state = {
    year: null,
    month: null,
    days: [],
    leaves: {},
    grid: {},
    dayOnly: {},
    last: null,
  };
  var LS_LEAVES = 'sheet_ayilma_leaves_v1';
  var LS_DAYONLY = 'sheet_ayilma_dayonly_v1';

  function $(id) { return document.getElementById(id); }

  function ymValue() {
    var y = state.year, m = state.month;
    return y + '-' + String(m).padStart(2, '0');
  }

  function loadPersisted() {
    try {
      state.leaves = JSON.parse(localStorage.getItem(LS_LEAVES) || '{}') || {};
    } catch (e) { state.leaves = {}; }
    try {
      state.dayOnly = JSON.parse(localStorage.getItem(LS_DAYONLY) || '{}') || {};
    } catch (e) { state.dayOnly = {}; }
  }

  function saveLeaves() {
    try { localStorage.setItem(LS_LEAVES, JSON.stringify(state.leaves)); } catch (e) {}
  }
  function saveDayOnly() {
    try { localStorage.setItem(LS_DAYONLY, JSON.stringify(state.dayOnly)); } catch (e) {}
  }

  function monthKey() {
    return ymValue();
  }

  function leaveFor(name, iso) {
    var mk = monthKey();
    return (((state.leaves[mk] || {})[name] || {})[iso]) || '';
  }

  function setLeave(name, iso, code) {
    var mk = monthKey();
    if (!state.leaves[mk]) state.leaves[mk] = {};
    if (!state.leaves[mk][name]) state.leaves[mk][name] = {};
    if (!code) delete state.leaves[mk][name][iso];
    else state.leaves[mk][name][iso] = code;
    saveLeaves();
  }

  function buildDays(year, month) {
    var n = new Date(year, month, 0).getDate();
    var days = [];
    var tr = ['Pzt','Sal','Çar','Per','Cum','Cmt','Paz'];
    for (var d = 1; d <= n; d++) {
      var dt = new Date(year, month - 1, d);
      var wd = (dt.getDay() + 6) % 7;
      var iso = year + '-' + String(month).padStart(2,'0') + '-' + String(d).padStart(2,'0');
      days.push({ day: d, iso: iso, weekday: wd, weekday_tr: tr[wd], is_weekend: wd >= 5 });
    }
    return days;
  }

  function ensureGridSkeleton() {
    state.days = buildDays(state.year, state.month);
    var names = (meta && meta.all) || [];
    names.forEach(function (name) {
      if (!state.grid[name]) state.grid[name] = {};
      state.days.forEach(function (dm) {
        var leave = leaveFor(name, dm.iso);
        if (leave) state.grid[name][dm.iso] = leave;
        else if (!state.grid[name][dm.iso]) state.grid[name][dm.iso] = '';
        else if (state.grid[name][dm.iso] === 'Yİ' || state.grid[name][dm.iso] === 'RP') {
          /* keep */
        }
      });
    });
  }

  function cycleLeave(name, iso) {
    if (name === ((meta && meta.lead) || 'Gülten Çelik')) return;
    var cur = leaveFor(name, iso) || '';
    var next = cur === '' ? 'Yİ' : (cur === 'Yİ' ? 'RP' : '');
    setLeave(name, iso, next);
    state.grid[name][iso] = next;
    renderTable();
  }

  function renderDayOnly() {
    var box = $('sh-day-only');
    if (!box || !meta) return;
    box.innerHTML = '<span class="text-[11px] font-semibold uppercase tracking-wide text-slate-400 w-full">Yalnız gündüz (08–16)</span>';
    (meta.staff || []).forEach(function (name) {
      var id = 'sh-do-' + name.replace(/\s+/g, '-');
      var lab = document.createElement('label');
      lab.className = 'inline-flex items-center gap-1.5 rounded-full border border-slate-200 px-2.5 py-1 text-[11px] dark:border-zinc-700';
      lab.innerHTML = '<input type="checkbox" id="' + id + '"' + (state.dayOnly[name] ? ' checked' : '') + '> ' + name;
      box.appendChild(lab);
      lab.querySelector('input').addEventListener('change', function (ev) {
        if (ev.target.checked) state.dayOnly[name] = true;
        else delete state.dayOnly[name];
        saveDayOnly();
      });
    });
  }

  function hoursOf(code) {
    if (code === '8') return 8;
    if (code === '16') return 16;
    if (code === '24') return 24;
    return 0;
  }

  function renderTable() {
    var head = $('sh-head');
    var body = $('sh-body');
    if (!head || !body || !meta) return;
    ensureGridSkeleton();

    var hr = '<tr><th class="sh-name">Ad Soyadı</th>';
    state.days.forEach(function (dm) {
      hr += '<th class="' + (dm.is_weekend ? 'sh-wknd' : '') + '" title="' + dm.iso + '">' + dm.day + '<div class="text-[9px] font-semibold opacity-70">' + dm.weekday_tr + '</div></th>';
    });
    hr += '<th>Çalıştığı</th><th>Aylık</th><th>Fazla</th></tr>';
    head.innerHTML = hr;

    var ideal = 0;
    state.days.forEach(function (dm) { if (!dm.is_weekend) ideal += 8; });

    var html = '';
    (meta.all || []).forEach(function (name) {
      var isLead = name === meta.lead;
      var worked = 0;
      html += '<tr class="' + (isLead ? 'sh-lead' : '') + '">';
      html += '<td class="sh-name">' + name + (isLead ? ' <span class="text-[9px] font-semibold text-indigo-500">(sorumlu)</span>' : '') + '</td>';
      state.days.forEach(function (dm) {
        var code = (state.grid[name] && state.grid[name][dm.iso]) || '';
        worked += hoursOf(code);
        var cls = 'sh-cell' + (dm.is_weekend ? ' sh-wknd' : '') + ((code === 'Yİ' || code === 'RP') ? ' sh-leave' : '');
        html += '<td class="' + cls + '" data-name="' + name.replace(/"/g, '&quot;') + '" data-iso="' + dm.iso + '">' + (code || '') + '</td>';
      });
      var target = isLead ? 0 : ideal;
      var ot = isLead ? 0 : Math.max(0, worked - target);
      html += '<td class="sh-tot">' + worked + '</td>';
      html += '<td class="sh-tot">' + target + '</td>';
      html += '<td class="sh-tot">' + ot + '</td></tr>';
    });
    body.innerHTML = html;

    body.querySelectorAll('.sh-cell').forEach(function (td) {
      td.addEventListener('click', function () {
        cycleLeave(td.getAttribute('data-name'), td.getAttribute('data-iso'));
      });
    });
  }

  function renderFromServer(payload) {
    state.last = payload;
    state.days = payload.days || [];
    state.grid = {};
    (payload.rows || []).forEach(function (row) {
      state.grid[row.name] = Object.assign({}, row.cells || {});
    });
    renderTable();

    var sum = $('sh-summary');
    if (sum) {
      sum.classList.remove('hidden');
      sum.innerHTML =
        '<div class="rounded-xl bg-white px-3 py-2 ring-1 ring-slate-200 text-xs dark:bg-zinc-900 dark:ring-0"><div class="text-slate-400">Hafta içi</div><div class="text-lg font-black">' + payload.weekday_count + ' × 8 = ' + payload.ideal_hours_staff + 's</div></div>' +
        '<div class="rounded-xl bg-white px-3 py-2 ring-1 ring-slate-200 text-xs dark:bg-zinc-900 dark:ring-0"><div class="text-slate-400">Max / kişi</div><div class="text-lg font-black">' + payload.max_monthly_hours + 's</div></div>' +
        '<div class="rounded-xl bg-white px-3 py-2 ring-1 ring-slate-200 text-xs dark:bg-zinc-900 dark:ring-0"><div class="text-slate-400">Sonraki ay 1. gün boş</div><div class="text-sm font-bold">' + ((payload.next_month_must_rest || []).join(', ') || '—') + '</div></div>' +
        '<div class="rounded-xl bg-white px-3 py-2 ring-1 ring-slate-200 text-xs dark:bg-zinc-900 dark:ring-0"><div class="text-slate-400">Uyarı</div><div class="text-sm font-bold">' + ((payload.warnings || []).length) + '</div></div>';
    }
    var w = $('sh-warn');
    if (w) {
      if (payload.warnings && payload.warnings.length) {
        w.classList.remove('hidden');
        w.innerHTML = payload.warnings.map(function (x) { return '<div>• ' + x + '</div>'; }).join('');
      } else {
        w.classList.add('hidden');
        w.innerHTML = '';
      }
    }
  }

  function collectLeavesPayload() {
    var mk = monthKey();
    return state.leaves[mk] || {};
  }

  function generate() {
    var btn = $('sh-generate');
    if (btn) { btn.disabled = true; btn.textContent = 'Dolduruluyor…'; }
    var dayOnly = Object.keys(state.dayOnly).filter(function (k) { return state.dayOnly[k]; });
    fetch('/api/sheet/ayilma/generate', {
      method: 'POST',
      credentials: 'same-origin',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        year: state.year,
        month: state.month,
        leaves: collectLeavesPayload(),
        day_only: dayOnly,
        prefer_48h_after_24: !!( $('sh-prefer-48') && $('sh-prefer-48').checked ),
      }),
    })
      .then(function (r) { return r.json().then(function (d) { return { ok: r.ok, d: d }; }); })
      .then(function (x) {
        if (!x.ok) throw new Error((x.d && x.d.detail) || 'Hata');
        renderFromServer(x.d);
      })
      .catch(function (err) {
        var w = $('sh-warn');
        if (w) { w.classList.remove('hidden'); w.textContent = String(err.message || err); }
      })
      .finally(function () {
        if (btn) { btn.disabled = false; btn.textContent = 'Çizelgeyi doldur'; }
      });
  }

  function clearWorkKeepLeaves() {
    ensureGridSkeleton();
    (meta.all || []).forEach(function (name) {
      state.days.forEach(function (dm) {
        var leave = leaveFor(name, dm.iso);
        state.grid[name][dm.iso] = leave || '';
      });
    });
    renderTable();
  }

  function initMonthInput() {
    var inp = $('sh-month');
    if (!inp) return;
    inp.value = ymValue();
    inp.addEventListener('change', function () {
      var parts = (inp.value || '').split('-');
      if (parts.length !== 2) return;
      state.year = parseInt(parts[0], 10);
      state.month = parseInt(parts[1], 10);
      state.grid = {};
      ensureGridSkeleton();
      renderTable();
    });
  }

  fetch('/api/sheet/ayilma/meta', { credentials: 'same-origin', cache: 'no-store' })
    .then(function (r) { return r.json(); })
    .then(function (d) {
      if (!d.ok) throw new Error('meta');
      meta = d;
      loadPersisted();
      state.year = d.default_year;
      state.month = d.default_month;
      initMonthInput();
      renderDayOnly();
      ensureGridSkeleton();
      renderTable();
    })
    .catch(function () {
      var w = $('sh-warn');
      if (w) { w.classList.remove('hidden'); w.textContent = 'Sheet meta yüklenemedi (yetki?).'; }
    });

  var g = $('sh-generate');
  if (g) g.addEventListener('click', generate);
  var c = $('sh-clear-work');
  if (c) c.addEventListener('click', clearWorkKeepLeaves);
})();
</script>
{% endblock %}
