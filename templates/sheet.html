{% extends "base.html" %}
{% block content %}
<div id="sheet-page" class="mx-auto w-full min-w-0 max-w-[1600px] space-y-3 sm:space-y-4" data-header-title="Sheet">
  <div class="sh-card rounded-2xl bg-white px-3 py-3 shadow-sm ring-1 ring-slate-200 dark:bg-zinc-900 dark:ring-0 dark:shadow-none sm:px-5 sm:py-4">
    <div class="flex flex-col gap-3 lg:flex-row lg:items-start lg:justify-between">
      <div class="min-w-0">
        <h2 class="text-base font-bold leading-snug text-slate-900 dark:text-zinc-200 sm:text-lg">Ayılma hemşireleri · aylık çizelge</h2>
      </div>
      <div class="sh-toolbar flex w-full min-w-0 flex-col gap-2 lg:max-w-xl lg:items-end">
        <div class="sh-toolbar-picks grid grid-cols-2 gap-2">
          <label class="text-[11px] font-semibold uppercase tracking-wide text-slate-400">
            Yıl
            <select id="sh-year" class="mt-0.5 block w-full rounded-lg border border-slate-200 bg-white px-2 py-2 text-sm font-bold text-slate-900 dark:border-transparent dark:bg-zinc-800 dark:text-zinc-100"></select>
          </label>
          <label class="text-[11px] font-semibold uppercase tracking-wide text-slate-400">
            Ay
            <select id="sh-month" class="mt-0.5 block w-full min-w-0 rounded-lg border border-slate-200 bg-white px-2 py-2 text-sm font-bold text-slate-900 dark:border-transparent dark:bg-zinc-800 dark:text-zinc-100"></select>
          </label>
        </div>
        <div class="sh-toolbar-actions grid grid-cols-2 gap-2">
          <button type="button" id="sh-open-month" class="sh-btn rounded-lg border border-slate-200 px-3 py-2.5 text-xs font-semibold text-slate-700 hover:bg-slate-50 active:bg-slate-100 dark:border-zinc-700 dark:text-zinc-200 dark:hover:bg-zinc-800">
            Takvimi getir
          </button>
          <button type="button" id="sh-clear-work" class="sh-btn rounded-lg border border-slate-200 px-3 py-2.5 text-xs font-semibold text-slate-600 hover:bg-slate-50 active:bg-slate-100 dark:border-zinc-700 dark:text-zinc-300 dark:hover:bg-zinc-800" title="Görüntülenen ayı tamamen boşalt (mesai + İST/Yİ/RP)">
            Mesaiyi temizle
          </button>
        </div>
        <div class="sh-export-row grid grid-cols-1 gap-2 sm:grid-cols-[1fr_auto] sm:items-end">
          <label class="text-[11px] font-semibold uppercase tracking-wide text-slate-400">
            İndirme formatı
            <select id="sh-export-format" class="mt-0.5 block w-full rounded-lg border border-slate-200 bg-white px-2 py-2 text-sm font-bold text-slate-900 dark:border-transparent dark:bg-zinc-800 dark:text-zinc-100">
              <option value="xlsx">Excel (.xlsx) — Windows / Android</option>
              <option value="csv">CSV (.csv) — Excel, Sheets, evrensel</option>
              <option value="docx">Word (.docx) — Windows / Android</option>
            </select>
          </label>
          <button type="button" id="sh-download" class="sh-btn rounded-lg border border-emerald-300 bg-emerald-50 px-3 py-2.5 text-xs font-semibold text-emerald-800 hover:bg-emerald-100 active:bg-emerald-200 dark:border-emerald-800 dark:bg-emerald-950/40 dark:text-emerald-200 dark:hover:bg-emerald-950/70">
            İndir
          </button>
        </div>
      </div>
    </div>

    <div class="mt-4 flex flex-col gap-3 rounded-xl border border-indigo-200 bg-indigo-50/70 px-3 py-3 dark:border-indigo-900/50 dark:bg-indigo-950/30 sm:px-4">
      <label class="inline-flex items-start gap-2 text-sm font-semibold text-slate-800 dark:text-zinc-100">
        <input id="sh-use-constraints" type="checkbox" class="mt-0.5 shrink-0 rounded border-slate-300">
        <span>Bu bilgilere göre çizelgeyi oluştur</span>
      </label>
      <div class="sh-gen-actions flex flex-col gap-2 sm:flex-row sm:flex-wrap sm:items-center">
        <button type="button" id="sh-generate" class="sh-btn sh-btn-primary rounded-lg bg-indigo-600 px-4 py-2.5 text-xs font-bold text-white hover:bg-indigo-500 active:bg-indigo-700">
          Çizelgeyi oluştur
        </button>
        <button type="button" id="sh-regenerate" class="sh-btn hidden rounded-lg border border-indigo-300 bg-white px-3 py-2.5 text-xs font-semibold text-indigo-700 hover:bg-indigo-50 active:bg-indigo-100 dark:border-indigo-800 dark:bg-zinc-900 dark:text-indigo-300 dark:hover:bg-zinc-800">
          Yeniden oluştur
        </button>
        <button type="button" id="sh-special-open" class="sh-btn rounded-lg border border-violet-300 bg-violet-50 px-3 py-2.5 text-xs font-semibold text-violet-900 hover:bg-violet-100 active:bg-violet-200 dark:border-violet-800 dark:bg-violet-950/40 dark:text-violet-200">
          Özel koşul gir
        </button>
      </div>
      <div class="sh-gen-options flex flex-col gap-2 text-[11px] text-slate-500 dark:text-zinc-400 sm:flex-row sm:flex-wrap sm:items-center sm:gap-3">
        <label class="inline-flex items-start gap-2">
          <input id="sh-prefer-48" type="checkbox" class="mt-0.5 shrink-0 rounded border-slate-300" checked>
          <span>24 saat sonrası mümkünse 2 gün boşluk tercih et</span>
        </label>
        <span id="sh-constraint-count" class="tabular-nums"></span>
        <span id="sh-special-count" class="tabular-nums text-violet-700 dark:text-violet-300"></span>
      </div>
    </div>

    <div id="sh-special-list" class="mt-3 hidden space-y-1 text-[11px] text-slate-600 dark:text-zinc-300"></div>

  </div>

  <div id="sh-special-modal" class="sh-sp-overlay" hidden>
    <div class="sh-sp-panel" role="dialog" aria-modal="true" aria-labelledby="sh-sp-title">
      <div class="sh-sp-panel-head">
        <h3 id="sh-sp-title">Özel koşul</h3>
        <button type="button" id="sh-special-close" class="sh-sp-x">Kapat</button>
      </div>
      <ol class="sh-sp-steps">
        <li>
          <span class="sh-sp-step-n">1</span>
          <label class="sh-sp-field">
            Kişi seç
            <select id="sh-sp-name"></select>
          </label>
        </li>
        <li>
          <span class="sh-sp-step-n">2</span>
          <div class="sh-sp-field">
            <span>Tarih seç</span>
            <div id="sh-sp-cal" class="sh-sp-cal"></div>
            <p id="sh-sp-picked" class="sh-sp-hint"></p>
          </div>
        </li>
        <li>
          <span class="sh-sp-step-n">3</span>
          <div class="sh-sp-field">
            <span>Bu günlerde</span>
            <div class="sh-sp-radios">
              <label><input type="radio" name="sh-sp-mode" value="work" checked> Çalışsın</label>
              <label><input type="radio" name="sh-sp-mode" value="avoid"> Çalışmasın</label>
            </div>
          </div>
        </li>
        <li>
          <span class="sh-sp-step-n">4</span>
          <div class="sh-sp-field">
            <span>Her hafta tekrarlasın mı?</span>
            <div class="sh-sp-radios">
              <label><input type="radio" name="sh-sp-weekly" value="1"> Evet</label>
              <label><input type="radio" name="sh-sp-weekly" value="0" checked> Hayır</label>
            </div>
          </div>
        </li>
      </ol>
      <button type="button" id="sh-sp-save" class="sh-sp-save">Kaydet</button>
    </div>
  </div>

  <div id="sh-summary" class="hidden grid gap-2 sm:grid-cols-2 lg:grid-cols-3"></div>

  <div class="sh-table-shell overflow-auto rounded-2xl bg-white shadow-sm ring-1 ring-slate-200 dark:bg-zinc-900 dark:ring-0">
    <div class="flex flex-wrap gap-2 border-b border-slate-100 px-3 py-2 text-[10px] font-semibold dark:border-zinc-800">
      <span class="rounded bg-sky-100 px-1.5 py-0.5 text-sky-800 dark:bg-sky-950 dark:text-sky-200">İST istek</span>
      <span class="rounded bg-amber-100 px-1.5 py-0.5 text-amber-900 dark:bg-amber-950 dark:text-amber-200">Yİ izin</span>
      <span class="rounded bg-rose-100 px-1.5 py-0.5 text-rose-900 dark:bg-rose-950 dark:text-rose-200">RP rapor</span>
    </div>
    <table class="sh-table min-w-full border-collapse text-[11px]">
      <thead id="sh-head"></thead>
      <tbody id="sh-body"></tbody>
    </table>
  </div>
</div>

<script>
(function () {
  var meta = null;
  var state = {
    year: null,
    month: null,
    days: [],
    leaves: {},
    special: {},
    grid: {},
    last: null,
    variant: 0,
  };
  var LS_LEAVES = 'sheet_ayilma_leaves_v2';
  var LS_SPECIAL = 'sheet_ayilma_special_v1';
  var CONSTRAINT_CYCLE = ['', 'İST', 'Yİ', 'RP'];
  var spDraft = { dates: {} };

  function $(id) { return document.getElementById(id); }

  function ymValue() {
    return state.year + '-' + String(state.month).padStart(2, '0');
  }

  function loadPersisted() {
    try {
      state.leaves = JSON.parse(localStorage.getItem(LS_LEAVES) || '{}') || {};
    } catch (e) { state.leaves = {}; }
    try {
      var legacy = JSON.parse(localStorage.getItem('sheet_ayilma_leaves_v1') || '{}') || {};
      Object.keys(legacy).forEach(function (mk) {
        if (!state.leaves[mk]) state.leaves[mk] = legacy[mk];
      });
    } catch (e2) {}
    try {
      state.special = JSON.parse(localStorage.getItem(LS_SPECIAL) || '{}') || {};
    } catch (e3) { state.special = {}; }
  }

  function saveLeaves() {
    try { localStorage.setItem(LS_LEAVES, JSON.stringify(state.leaves)); } catch (e) {}
  }

  function saveSpecial() {
    try { localStorage.setItem(LS_SPECIAL, JSON.stringify(state.special)); } catch (e) {}
  }

  function monthKey() { return ymValue(); }

  function specialForMonth() {
    var mk = monthKey();
    if (!state.special[mk]) state.special[mk] = [];
    return state.special[mk];
  }

  function updateSpecialCount() {
    var el = $('sh-special-count');
    var list = $('sh-special-list');
    var rules = specialForMonth();
    if (el) el.textContent = rules.length ? (rules.length + ' özel koşul') : '';
    if (!list) return;
    if (!rules.length) {
      list.classList.add('hidden');
      list.innerHTML = '';
      return;
    }
    list.classList.remove('hidden');
    var WD = ['Pzt','Sal','Çar','Per','Cum','Cmt','Paz'];
    list.innerHTML = rules.map(function (r, idx) {
      var modeLabel = r.mode === 'work' ? 'çalışsın' : 'çalışmasın';
      var days = (r.dates || []).map(function (iso) {
        var p = iso.split('-');
        var d = parseInt(p[2], 10);
        var dt = new Date(parseInt(p[0],10), parseInt(p[1],10)-1, d);
        var wd = (dt.getDay() + 6) % 7;
        return d + ' ' + WD[wd];
      }).join(', ');
      var wk = r.weekly ? ' · her hafta' : '';
      return '<div class="flex items-center justify-between gap-2 rounded-lg bg-violet-50 px-2 py-1.5 dark:bg-violet-950/30">' +
        '<span><strong>' + r.name + '</strong> — ' + modeLabel + ': ' + days + wk + '</span>' +
        '<button type="button" class="sh-sp-del sh-btn-inline min-h-[2.75rem] min-w-[2.75rem] px-2 text-rose-600 font-bold" data-idx="' + idx + '">Sil</button></div>';
    }).join('');
    list.querySelectorAll('.sh-sp-del').forEach(function (btn) {
      btn.addEventListener('click', function () {
        var i = parseInt(btn.getAttribute('data-idx'), 10);
        specialForMonth().splice(i, 1);
        saveSpecial();
        updateSpecialCount();
      });
    });
  }

  function leaveFor(name, iso) {
    return (((state.leaves[monthKey()] || {})[name] || {})[iso]) || '';
  }

  function setLeave(name, iso, code) {
    var mk = monthKey();
    if (!state.leaves[mk]) state.leaves[mk] = {};
    if (!state.leaves[mk][name]) state.leaves[mk][name] = {};
    if (!code) delete state.leaves[mk][name][iso];
    else state.leaves[mk][name][iso] = code;
    saveLeaves();
    updateConstraintCount();
  }

  function countConstraints() {
    var bag = state.leaves[monthKey()] || {};
    var n = 0;
    Object.keys(bag).forEach(function (name) {
      Object.keys(bag[name] || {}).forEach(function (iso) {
        if (bag[name][iso]) n += 1;
      });
    });
    return n;
  }

  function hasConstraintMarkers() {
    if (countConstraints() > 0) return true;
    if (!state.grid || !state.days.length) return false;
    for (var ni = 0; ni < (meta && meta.all ? meta.all.length : 0); ni++) {
      var name = meta.all[ni];
      var row = state.grid[name] || {};
      for (var di = 0; di < state.days.length; di++) {
        if (isConstraint(row[state.days[di].iso] || '')) return true;
      }
    }
    return false;
  }

  function syncConstraintsCheckbox() {
    var cb = $('sh-use-constraints');
    if (!cb) return;
    if (hasConstraintMarkers()) cb.checked = true;
  }

  function updateConstraintCount() {
    var el = $('sh-constraint-count');
    if (!el) return;
    var n = countConstraints();
    el.textContent = n ? (n + ' işaretli gün (bu ay)') : 'Bu ay işaretli gün yok';
    syncConstraintsCheckbox();
    updateSpecialCount();
  }

  function renderSpecialCalendar() {
    var cal = $('sh-sp-cal');
    if (!cal || !state.year || !state.month) return;
    var days = buildDays(state.year, state.month);
    var labels = ['Pzt','Sal','Çar','Per','Cum','Cmt','Paz'];
    var html = labels.map(function (l) {
      return '<div class="sh-sp-cal-hd">' + l + '</div>';
    }).join('');
    var firstWd = days[0].weekday;
    for (var i = 0; i < firstWd; i++) {
      html += '<div class="sh-sp-day is-muted">&nbsp;</div>';
    }
    days.forEach(function (dm) {
      var picked = !!spDraft.dates[dm.iso];
      html += '<button type="button" class="sh-sp-day' + (picked ? ' is-picked' : '') + '" data-iso="' + dm.iso + '">' + dm.day + '</button>';
    });
    cal.innerHTML = html;
    cal.querySelectorAll('.sh-sp-day[data-iso]').forEach(function (btn) {
      btn.addEventListener('click', function () {
        var iso = btn.getAttribute('data-iso');
        if (spDraft.dates[iso]) delete spDraft.dates[iso];
        else spDraft.dates[iso] = true;
        renderSpecialCalendar();
        updateSpPickedLabel();
      });
    });
    updateSpPickedLabel();
  }

  function updateSpPickedLabel() {
    var el = $('sh-sp-picked');
    if (!el) return;
    var n = Object.keys(spDraft.dates).length;
    el.textContent = n ? (n + ' gün seçildi') : 'Gün seçilmedi';
  }

  function openSpecialModal() {
    if (!meta || !syncMonthFromInputs()) return;
    var sel = $('sh-sp-name');
    if (sel) {
      sel.innerHTML = '<option value="">— kişi seç —</option>' + (meta.staff || []).map(function (n) {
        return '<option value="' + n + '">' + n + '</option>';
      }).join('');
    }
    spDraft.dates = {};
    var work = document.querySelector('input[name="sh-sp-mode"][value="work"]');
    var noWk = document.querySelector('input[name="sh-sp-weekly"][value="0"]');
    if (work) work.checked = true;
    if (noWk) noWk.checked = true;
    renderSpecialCalendar();
    var modal = $('sh-special-modal');
    if (modal) {
      modal.hidden = false;
      modal.classList.add('is-open');
      document.body.classList.add('sh-modal-open');
    }
  }

  function closeSpecialModal() {
    var modal = $('sh-special-modal');
    if (modal) {
      modal.classList.remove('is-open');
      modal.hidden = true;
    }
    document.body.classList.remove('sh-modal-open');
  }

  function saveSpecialRule() {
    var nameEl = $('sh-sp-name');
    var name = nameEl ? String(nameEl.value || '').trim() : '';
    var modeEl = document.querySelector('input[name="sh-sp-mode"]:checked');
    var weeklyEl = document.querySelector('input[name="sh-sp-weekly"]:checked');
    var mode = modeEl ? modeEl.value : 'work';
    var weekly = weeklyEl ? weeklyEl.value === '1' : false;
    var dates = Object.keys(spDraft.dates).sort();
    if (!name) {
      if (nameEl) nameEl.focus();
      return;
    }
    if (!dates.length) return;
    specialForMonth().push({
      id: String(Date.now()) + '-' + Math.random().toString(16).slice(2, 8),
      name: name,
      mode: mode,
      dates: dates,
      weekly: weekly,
    });
    saveSpecial();
    updateSpecialCount();
    closeSpecialModal();
  }

  function buildDays(year, month) {
    var n = new Date(year, month, 0).getDate();
    var days = [];
    var tr = ['Pzt','Sal','Çar','Per','Cum','Cmt','Paz'];
    for (var d = 1; d <= n; d++) {
      var dt = new Date(year, month - 1, d);
      var wd = (dt.getDay() + 6) % 7;
      var iso = year + '-' + String(month).padStart(2,'0') + '-' + String(d).padStart(2,'0');
      days.push({ day: d, iso: iso, weekday: wd, weekday_tr: tr[wd], is_weekend: wd >= 5 });
    }
    return days;
  }

  function isConstraint(code) {
    return code === 'İST' || code === 'Yİ' || code === 'RP';
  }

  function setActionMsg(_text, _ok) {}

  function syncMonthFromInputs() {
    var yEl = $('sh-year');
    var mEl = $('sh-month');
    if (!yEl || !mEl) return false;
    var y = parseInt(yEl.value, 10);
    var m = parseInt(mEl.value, 10);
    if (!y || !m) return false;
    state.year = y;
    state.month = m;
    return true;
  }

  function openMonthCalendar() {
    if (!syncMonthFromInputs() && !(state.year && state.month)) return;
    state.grid = {};
    state.days = buildDays(state.year, state.month);
    state.last = null;
    (meta.all || []).forEach(function (name) {
      state.grid[name] = {};
      state.days.forEach(function (dm) {
        state.grid[name][dm.iso] = leaveFor(name, dm.iso) || '';
      });
    });
    var sum = $('sh-summary');
    if (sum) { sum.classList.add('hidden'); sum.innerHTML = ''; }
    var regen = $('sh-regenerate');
    if (regen) regen.classList.add('hidden');
    state.variant = 0;
    updateConstraintCount();
    renderTable();
  }

  function ensureGridSkeleton() {
    state.days = buildDays(state.year, state.month);
    (meta.all || []).forEach(function (name) {
      if (!state.grid[name]) state.grid[name] = {};
      state.days.forEach(function (dm) {
        var leave = leaveFor(name, dm.iso);
        if (leave) state.grid[name][dm.iso] = leave;
        else if (state.grid[name][dm.iso] == null) state.grid[name][dm.iso] = '';
        else if (isConstraint(state.grid[name][dm.iso])) {
          /* keep */
        }
      });
    });
  }

  function cycleConstraint(name, iso) {
    if (name === ((meta && meta.lead) || 'Gülten Çelik')) return;
    var cur = leaveFor(name, iso) || '';
    var i = CONSTRAINT_CYCLE.indexOf(cur);
    if (i < 0) i = 0;
    var next = CONSTRAINT_CYCLE[(i + 1) % CONSTRAINT_CYCLE.length];
    setLeave(name, iso, next);
    /* Mesai hücrelerinin üstüne yazma: yalnız işaret / temizle */
    if (next) state.grid[name][iso] = next;
    else if (isConstraint(state.grid[name][iso]) || !state.grid[name][iso]) state.grid[name][iso] = '';
    else {
      /* mesai vardı, işaret kalkınca boş bırak — yeniden oluşturulsun */
      state.grid[name][iso] = '';
    }
    renderTable();
  }

  function hoursOf(code) {
    if (code === '8') return 8;
    if (code === '16') return 16;
    if (code === '24') return 24;
    if (code === 'Yİ') return 8; /* yıllık izin = 8s kullanılmış */
    return 0;
  }

  function cellClass(code, isWeekend) {
    var cls = 'sh-cell' + (isWeekend ? ' sh-wknd' : '');
    if (code === 'Yİ') cls += ' sh-leave-yi';
    else if (code === 'RP') cls += ' sh-leave-rp';
    else if (code === 'İST') cls += ' sh-leave-ist';
    return cls;
  }

  function renderTable() {
    var head = $('sh-head');
    var body = $('sh-body');
    if (!head || !body || !meta) return;
    ensureGridSkeleton();

    var hr = '<tr><th class="sh-name">Ad Soyadı</th>';
    state.days.forEach(function (dm) {
      hr += '<th class="' + (dm.is_weekend ? 'sh-wknd' : '') + '" title="' + dm.iso + '">' + dm.day + '<div class="text-[9px] font-semibold opacity-70">' + dm.weekday_tr + '</div></th>';
    });
    hr += '<th>Çalıştığı</th><th>Aylık</th><th>Fazla</th></tr>';
    head.innerHTML = hr;

    var ideal = 0;
    state.days.forEach(function (dm) { if (!dm.is_weekend) ideal += 8; });

    var html = '';
    (meta.all || []).forEach(function (name) {
      var isLead = name === meta.lead;
      var worked = 0;
      html += '<tr class="' + (isLead ? 'sh-lead' : '') + '">';
      html += '<td class="sh-name">' + name + '</td>';
      state.days.forEach(function (dm) {
        var code = (state.grid[name] && state.grid[name][dm.iso]) || '';
        worked += hoursOf(code);
        html += '<td class="' + cellClass(code, dm.is_weekend) + '" data-name="' + name.replace(/"/g, '&quot;') + '" data-iso="' + dm.iso + '">' + (code || '') + '</td>';
      });
      var target = isLead ? 0 : ideal;
      var ot = isLead ? 0 : Math.max(0, worked - target);
      html += '<td class="sh-tot">' + worked + '</td>';
      html += '<td class="sh-tot">' + target + '</td>';
      html += '<td class="sh-tot">' + ot + '</td></tr>';
    });
    body.innerHTML = html;

    body.querySelectorAll('.sh-cell').forEach(function (td) {
      td.addEventListener('click', function () {
        cycleConstraint(td.getAttribute('data-name'), td.getAttribute('data-iso'));
      });
    });
    updateConstraintCount();
  }

  function renderFromServer(payload) {
    state.last = payload;
    state.days = payload.days || [];
    state.grid = {};
    (payload.rows || []).forEach(function (row) {
      state.grid[row.name] = Object.assign({}, row.cells || {});
    });
    /* Sunucudan gelen izinleri localStorage ile senkron tut */
    var mk = monthKey();
    if (!state.leaves[mk]) state.leaves[mk] = {};
    (payload.rows || []).forEach(function (row) {
      if (row.role === 'lead') return;
      Object.keys(row.cells || {}).forEach(function (iso) {
        var c = row.cells[iso];
        if (isConstraint(c)) {
          if (!state.leaves[mk][row.name]) state.leaves[mk][row.name] = {};
          state.leaves[mk][row.name][iso] = c;
        }
      });
    });
    saveLeaves();
    renderTable();

    var sum = $('sh-summary');
    if (sum) {
      sum.classList.remove('hidden');
      sum.innerHTML =
        '<div class="rounded-xl bg-white px-3 py-2 ring-1 ring-slate-200 text-xs dark:bg-zinc-900 dark:ring-0"><div class="text-slate-400">Hafta içi</div><div class="text-lg font-black">' + payload.weekday_count + ' × 8 = ' + payload.ideal_hours_staff + 's</div></div>' +
        '<div class="rounded-xl bg-white px-3 py-2 ring-1 ring-slate-200 text-xs dark:bg-zinc-900 dark:ring-0"><div class="text-slate-400">Max / kişi</div><div class="text-lg font-black">' + payload.max_monthly_hours + 's</div></div>' +
        '<div class="rounded-xl bg-white px-3 py-2 ring-1 ring-slate-200 text-xs dark:bg-zinc-900 dark:ring-0"><div class="text-slate-400">Sonraki ay 1. gün boş</div><div class="text-sm font-bold">' + ((payload.next_month_must_rest || []).join(', ') || '—') + '</div></div>';
    }
  }

  function collectLeavesPayload() {
    syncConstraintsCheckbox();
    var use = $('sh-use-constraints');
    if (use && !use.checked) return {};
    return state.leaves[monthKey()] || {};
  }

  function generate(opts) {
    opts = opts || {};
    if (!syncMonthFromInputs()) {
      setActionMsg('Ay seçilemedi.', false);
      return;
    }
    if (opts.fresh) state.variant = 0;
    else if (opts.reroll) state.variant = (state.variant || 0) + 1;
    var btn = opts.reroll ? $('sh-regenerate') : $('sh-generate');
    var regen = $('sh-regenerate');
    if (btn) { btn.disabled = true; btn.textContent = opts.reroll ? 'Yeniden…' : 'Oluşturuluyor…'; }
    var dayOnly = [];
    var leaves = collectLeavesPayload();
    var special_rules = specialForMonth().map(function (r) {
      return { name: r.name, mode: r.mode, dates: r.dates, weekly: !!r.weekly };
    });
    fetch('/api/sheet/ayilma/generate', {
      method: 'POST',
      credentials: 'same-origin',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        year: state.year,
        month: state.month,
        leaves: leaves,
        day_only: dayOnly,
        prefer_48h_after_24: !!( $('sh-prefer-48') && $('sh-prefer-48').checked ),
        special_rules: special_rules,
        variant: state.variant || 0,
      }),
    })
      .then(function (r) { return r.json().then(function (d) { return { ok: r.ok, d: d }; }); })
      .then(function (x) {
        if (!x.ok) throw new Error((x.d && x.d.detail) || 'Hata');
        renderFromServer(x.d);
        if (regen) regen.classList.remove('hidden');
      })
      .catch(function (_err) {
      })
      .finally(function () {
        var gBtn = $('sh-generate');
        if (gBtn) { gBtn.disabled = false; gBtn.textContent = 'Çizelgeyi oluştur'; }
        if (regen) { regen.disabled = false; regen.textContent = 'Yeniden oluştur'; }
      });
  }

  function clearWorkKeepLeaves() {
    if (!meta) {
      setActionMsg('Önce sayfa yüklensin.', false);
      return;
    }
    if (!syncMonthFromInputs()) {
      setActionMsg('Ay seçilemedi.', false);
      return;
    }
    var mk = monthKey();
    state.days = buildDays(state.year, state.month);
    state.last = null;
    /* Görüntülenen ay: mesai + İST/Yİ/RP tamamen sil (localStorage dahil) */
    delete state.leaves[mk];
    saveLeaves();
    (meta.all || []).forEach(function (name) {
      state.grid[name] = {};
      state.days.forEach(function (dm) {
        state.grid[name][dm.iso] = '';
      });
    });
    var sum = $('sh-summary');
    if (sum) { sum.classList.add('hidden'); sum.innerHTML = ''; }
    updateConstraintCount();
    renderTable();
  }

  function buildExportRows() {
    ensureGridSkeleton();
    var ideal = 0;
    state.days.forEach(function (dm) { if (!dm.is_weekend) ideal += 8; });
    return (meta.all || []).map(function (name) {
      var isLead = name === meta.lead;
      var cells = {};
      var worked = 0;
      state.days.forEach(function (dm) {
        var code = (state.grid[name] && state.grid[name][dm.iso]) || '';
        cells[dm.iso] = code;
        worked += hoursOf(code);
      });
      var target = isLead ? 0 : ideal;
      return {
        name: name,
        role: isLead ? 'lead' : 'staff',
        cells: cells,
        worked_hours: worked,
        ideal_hours: target,
        overtime_hours: isLead ? 0 : Math.max(0, worked - target),
      };
    });
  }

  var EXPORT_FORMATS = {
    xlsx: { path: '/api/sheet/ayilma/export.xlsx', ext: 'xlsx', label: 'Excel' },
    csv: { path: '/api/sheet/ayilma/export.csv', ext: 'csv', label: 'CSV' },
    docx: { path: '/api/sheet/ayilma/export.docx', ext: 'docx', label: 'Word' },
  };

  function downloadExport() {
    if (!meta) {
      setActionMsg('Önce sayfa yüklensin.', false);
      return;
    }
    if (!syncMonthFromInputs()) {
      setActionMsg('Ay seçilemedi.', false);
      return;
    }
    ensureGridSkeleton();
    var fmtEl = $('sh-export-format');
    var fmt = (fmtEl && fmtEl.value) || 'xlsx';
    var spec = EXPORT_FORMATS[fmt] || EXPORT_FORMATS.xlsx;
    var btn = $('sh-download');
    if (btn) { btn.disabled = true; btn.textContent = 'İndiriliyor…'; }
    fetch(spec.path, {
      method: 'POST',
      credentials: 'same-origin',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        year: state.year,
        month: state.month,
        days: state.days,
        rows: buildExportRows(),
      }),
    })
      .then(function (r) {
        if (!r.ok) {
          return r.text().then(function (t) {
            var msg = 'İndirme hatası';
            try { msg = (JSON.parse(t).detail) || msg; } catch (e) {}
            throw new Error(msg);
          });
        }
        return r.blob();
      })
      .then(function (blob) {
        var url = URL.createObjectURL(blob);
        var a = document.createElement('a');
        a.href = url;
        a.download = 'ayilma_cizelge_' + state.year + '-' + String(state.month).padStart(2, '0') + '.' + spec.ext;
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(function () { URL.revokeObjectURL(url); }, 2000);
      })
      .catch(function (_err) {
      })
      .finally(function () {
        if (btn) { btn.disabled = false; btn.textContent = 'İndir'; }
      });
  }

  var MONTH_TR = [
    '', 'Ocak', 'Şubat', 'Mart', 'Nisan', 'Mayıs', 'Haziran',
    'Temmuz', 'Ağustos', 'Eylül', 'Ekim', 'Kasım', 'Aralık',
  ];

  function applyMonthFromInput() {
    if (!syncMonthFromInputs()) return;
    openMonthCalendar();
  }

  function initMonthInput() {
    var yEl = $('sh-year');
    var mEl = $('sh-month');
    if (!yEl || !mEl) return;
    var base = state.year || new Date().getFullYear();
    yEl.innerHTML = '';
    for (var y = base - 2; y <= base + 3; y++) {
      var o = document.createElement('option');
      o.value = String(y);
      o.textContent = String(y);
      if (y === state.year) o.selected = true;
      yEl.appendChild(o);
    }
    mEl.innerHTML = '';
    for (var m = 1; m <= 12; m++) {
      var om = document.createElement('option');
      om.value = String(m);
      om.textContent = MONTH_TR[m];
      if (m === state.month) om.selected = true;
      mEl.appendChild(om);
    }
    yEl.addEventListener('change', applyMonthFromInput);
    mEl.addEventListener('change', applyMonthFromInput);
  }

  fetch('/api/sheet/ayilma/meta', { credentials: 'same-origin', cache: 'no-store' })
    .then(function (r) { return r.json(); })
    .then(function (d) {
      if (!d.ok) throw new Error('meta');
      meta = d;
      loadPersisted();
      state.year = d.default_year;
      state.month = d.default_month;
      initMonthInput();
      openMonthCalendar();
    })
    .catch(function () {});

  var g = $('sh-generate');
  if (g) g.addEventListener('click', function () { generate({ fresh: true }); });
  var rg = $('sh-regenerate');
  if (rg) rg.addEventListener('click', function () { generate({ reroll: true }); });
  var c = $('sh-clear-work');
  if (c) c.addEventListener('click', clearWorkKeepLeaves);
  var dl = $('sh-download');
  if (dl) dl.addEventListener('click', downloadExport);
  var om = $('sh-open-month');
  if (om) om.addEventListener('click', applyMonthFromInput);
  var spo = $('sh-special-open');
  if (spo) spo.addEventListener('click', openSpecialModal);
  var spc = $('sh-special-close');
  if (spc) spc.addEventListener('click', closeSpecialModal);
  var sps = $('sh-sp-save');
  if (sps) sps.addEventListener('click', saveSpecialRule);
  var spm = $('sh-special-modal');
  if (spm) spm.addEventListener('click', function (ev) {
    if (ev.target === spm) closeSpecialModal();
  });
  document.addEventListener('keydown', function (ev) {
    if (ev.key !== 'Escape') return;
    var modal = $('sh-special-modal');
    if (modal && modal.classList.contains('is-open')) closeSpecialModal();
  });
})();
</script>
{% endblock %}
