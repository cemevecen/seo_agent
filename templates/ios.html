{% extends "base.html" %}
{% block content %}
<style>
  .pa-filters {
    display: flex; flex-wrap: wrap; align-items: flex-end; gap: 0.65rem 0.75rem; width: 100%;
  }
  .pa-filters > label.pa-f {
    display: flex; flex-direction: column; min-width: 0; flex: 1 1 calc(50% - 0.5rem);
    font-size: 0.6875rem; font-weight: 600; color: inherit; white-space: nowrap;
  }
  .pa-filters > label.pa-f--metric { flex: 1 1 100%; }
  .pa-filters > label.pa-f--date { flex: 1 1 calc(50% - 0.5rem); min-width: 8.75rem; }
  .pa-filters > label.pa-f--sm { flex: 1 1 calc(50% - 0.5rem); min-width: 7.5rem; }
  .pa-filters input[type="date"], .pa-filters select {
    margin-top: 0.25rem; width: 100%; border-radius: 0.5rem; border: 1px solid #cbd5e1;
    background: #fff; padding: 0.4rem 0.55rem; font-size: 0.8125rem; box-sizing: border-box;
  }
  html.dark .pa-filters input[type="date"], html.dark .pa-filters select {
    border-color: #3f3f46; background: #18181b; color: #c4c4cc;
  }
  .pa-filters .ia-metric-dd { margin-top: 0.25rem; width: 100%; position: relative; }
  .pa-filters .ia-metric-trigger {
    display: flex; width: 100%; align-items: center; justify-content: space-between; gap: 0.5rem;
    border-radius: 0.5rem; border: 1px solid #cbd5e1; background: #fff;
    padding: 0.4rem 0.55rem; font-size: 0.8125rem; line-height: 1.25; text-align: left;
    color: inherit; box-sizing: border-box; cursor: pointer;
  }
  html.dark .pa-filters .ia-metric-trigger {
    border-color: #3f3f46; background: #18181b; color: #c4c4cc;
  }
  .pa-filters .ia-metric-trigger:focus {
    outline: 2px solid rgba(14, 165, 233, 0.35); outline-offset: 1px;
  }
  #ia-metric-list {
    min-width: 16rem;
  }
  #ia-metric-list [data-ia-metric-pick][aria-selected="true"] {
    background: #eff6ff; color: #1e3a8a; font-weight: 600;
  }
  html.dark #ia-metric-list [data-ia-metric-pick][aria-selected="true"] {
    background: rgba(30, 58, 138, 0.35); color: #dbeafe;
  }
  .pa-filters .pa-f-actions { display: flex; align-items: flex-end; gap: 0.5rem; margin-left: auto; }
  .pa-filters .pa-f-btn {
    border-radius: 0.5rem; border: 1px solid #059669; background: #059669; color: #fff;
    padding: 0.45rem 0.9rem; font-size: 0.75rem; font-weight: 700; cursor: pointer;
  }
  .pa-filters .pa-f-btn:disabled { opacity: 0.6; cursor: wait; }
  #ia-table-wrap { width: 100%; overflow-x: auto; -webkit-overflow-scrolling: touch; }
  #ia-table-wrap > table { width: max-content; max-width: none; border-collapse: collapse; font-size: 0.75rem; }
  #ia-table-wrap th, #ia-table-wrap td { white-space: nowrap; text-align: right; }
  #ia-table-wrap th:first-child, #ia-table-wrap td:first-child { text-align: left; }
  #ia-results { position: relative; }
  #ia-results.is-loading > :not(#ia-loading) {
    opacity: 0.35;
    pointer-events: none;
    filter: saturate(0.7);
  }
  .ia-orbit {
    position: relative;
    width: 3.25rem;
    height: 3.25rem;
  }
  .ia-orbit__ring {
    position: absolute;
    inset: 0;
    border-radius: 9999px;
    border: 2.5px solid transparent;
    border-top-color: #0284c7;
    border-right-color: rgba(2, 132, 199, 0.35);
    animation: ia-orbit-spin 0.9s linear infinite;
  }
  .ia-orbit__ring--mid {
    inset: 0.45rem;
    border-top-color: #38bdf8;
    border-right-color: rgba(56, 189, 248, 0.3);
    animation-duration: 1.25s;
    animation-direction: reverse;
  }
  .ia-orbit__ring--inner {
    inset: 0.9rem;
    border-width: 2px;
    border-top-color: #7dd3fc;
    border-left-color: rgba(125, 211, 252, 0.4);
    border-right-color: transparent;
    animation-duration: 0.7s;
  }
  .ia-orbit__core {
    position: absolute;
    inset: 1.25rem;
    border-radius: 9999px;
    background: radial-gradient(circle at 35% 30%, #bae6fd, #0284c7 70%);
    box-shadow: 0 0 12px rgba(14, 165, 233, 0.45);
    animation: ia-orbit-pulse 1.2s ease-in-out infinite;
  }
  @keyframes ia-orbit-spin { to { transform: rotate(360deg); } }
  @keyframes ia-orbit-pulse {
    0%, 100% { transform: scale(0.85); opacity: 0.75; }
    50% { transform: scale(1); opacity: 1; }
  }
  .ia-orbit--sm {
    width: 1.75rem;
    height: 1.75rem;
  }
  .ia-orbit--sm .ia-orbit__ring { border-width: 2px; }
  .ia-orbit--sm .ia-orbit__ring--mid { inset: 0.28rem; }
  .ia-orbit--sm .ia-orbit__ring--inner { inset: 0.52rem; border-width: 1.5px; }
  .ia-orbit--sm .ia-orbit__core { inset: 0.72rem; }
  .ia-stability-inline {
    min-width: 0;
    max-width: min(22rem, calc(100vw - 10rem));
  }
  .ia-stability-inline .ia-stability-grid {
    width: 100%;
  }
  .ia-stability-inline .sf-card {
    padding: 0.4rem 0.55rem;
  }
  .ia-stability-inline .sf-card__title {
    font-size: 0.5625rem;
  }
  .ia-stability-inline .sf-card__value {
    font-size: clamp(0.85rem, 2.2vw, 1.05rem);
    margin-top: 0.15rem;
  }
  .ia-stability-inline .sf-card__sub,
  .ia-stability-inline .sf-card__extra {
    display: none;
  }
  .ia-stability-free-loading {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 2.5rem;
    min-width: 2.75rem;
  }
  .ia-stability-free-loading.hidden {
    display: none;
  }
  html.dark .ia-orbit__ring { border-top-color: #38bdf8; border-right-color: rgba(56, 189, 248, 0.35); }
  html.dark .ia-orbit__ring--mid { border-top-color: #7dd3fc; }
  html.dark .ia-orbit__ring--inner { border-top-color: #bae6fd; }
  @media (min-width: 900px) {
    .pa-filters > label.pa-f--metric { flex: 1.4 1 0; }
    .pa-filters > label.pa-f--date, .pa-filters > label.pa-f--sm { flex: 0.9 1 0; min-width: 0; }
  }
  .ia-stability-grid {
    display: grid;
    grid-template-columns: repeat(var(--sf-n, 4), minmax(0, 1fr));
    width: 100%;
  }
  .ia-stability-grid > * {
    min-width: 0;
  }
  .ia-stability-grid .sf-card {
    display: flex;
    flex-direction: column;
    min-height: 100%;
    padding: 0.55rem 0.65rem;
  }
  .ia-stability-grid .sf-card__title {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    font-size: clamp(0.5625rem, 1.1vw, 0.625rem);
  }
  .ia-stability-grid .sf-card__sub,
  .ia-stability-grid .sf-card__extra {
    display: -webkit-box;
    -webkit-box-orient: vertical;
    -webkit-line-clamp: 2;
    overflow: hidden;
    font-size: clamp(0.5625rem, 1vw, 0.625rem);
    line-height: 1.25;
  }
  .ia-stability-grid .sf-card__value {
    margin-top: 0.35rem;
    font-size: clamp(1rem, 2.4vw, 1.5rem);
    line-height: 1.1;
  }
  @media (max-width: 640px) {
    .ia-stability-grid {
      grid-template-columns: repeat(var(--sf-n, 4), minmax(5.75rem, 1fr));
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      padding-bottom: 0.15rem;
    }
  }
</style>
<div class="w-full max-w-none space-y-5" data-header-title="iOS · App Store Connect">

  function isGa4Metric(key) { return String(key || "").indexOf("ga4:") === 0; }

  async function runAnalytics() {
    var selected = iaSelectedMetrics.slice();
    overviewActive = !selected.length;
    var my = ++runSeq;
    if (abortCtrl) try { abortCtrl.abort(); } catch (_) {}
    abortCtrl = typeof AbortController !== "undefined" ? new AbortController() : null;
    var signal = abortCtrl ? abortCtrl.signal : undefined;
    iaBusy = true;
    setLoading(true);
    try {
      if (overviewActive) {
        iaLastPrimaryMetric = "";
        iaLastChart = null;
        var chartPromise = fetchOverviewMetrics(CHART_METRICS, signal);
        var tablePromise = fetchOverviewMetrics(TABLE_EXTRA, signal);
        var dataChart = await chartPromise;
        if (my !== runSeq) return;
        applyOverviewStatus(dataChart);
        var chartOnly = mapOverviewBundles(dataChart.bundles);
        iaOverviewBundles = chartOnly;
        iaOverviewCacheKey = iaStart.value + "|" + iaEnd.value;
        var chartBundles = chartOnly.filter(function (b) { return b.onChart; });
        var units = chartOnly.find(function (b) { return b.metric === "units"; }) || chartBundles[0];
        iaTotal.textContent = units ? fmtNum(units.total, true) : "—";
        iaTotalLabel.textContent = "Overview (first-time downloads)";
        iaCompareRange.textContent = dataChart.scrape_ok
          ? ("Özet · scrape " + (dataChart.scrape_fact_count || "") + " fact (kendi ölçeği)")
          : "Özet · ASC Sales/API yedek (kendi ölçeği)";
        drawMulti(chartBundles);
        renderOverviewTable(chartOnly);
        setLoading(false);

        var dataTable = await tablePromise;
        if (my !== runSeq) return;
        var extra = mapOverviewBundles(dataTable.bundles);
        var byMetric = {};
        chartOnly.concat(extra).forEach(function (b) { byMetric[b.metric] = b; });
        var bundles = CHART_METRICS.concat(TABLE_EXTRA).map(function (m) {
          return byMetric[m] || { metric: m, label: metricLabel(m), series: [], total: null, onChart: CHART_METRICS.indexOf(m) >= 0 };
        });
        iaOverviewBundles = bundles;
        iaOverviewCacheKey = iaStart.value + "|" + iaEnd.value;
        drawMulti(bundles.filter(function (b) { return b.onChart; }));
        renderOverviewTable(bundles);
        return;
      }

      var softNotes = [];
      var packs = await Promise.all(selected.map(function (metricKey) {
        var fetcher = isExternalMetric(metricKey)
          ? fetchExternalSeries(metricKey, signal)
          : fetchAscSeries(metricKey, signal);
        return fetcher.then(function (pack) {
          if (!(pack.series || []).length) softNotes.push((pack.label || metricKey) + " (0 nokta)");
          return {
            metric: metricKey,
            label: pack.label || metricLabel(metricKey),
            series: pack.series || [],
            total: pack.total,
            total_mode: pack.total_mode || "sum",
            message: pack.message || "",
            source: pack.source || (isVirgulMetric(metricKey) ? "virgul" : (isGa4Metric(metricKey) ? "ga4" : "asc"))
          };
        }).catch(function (err) {
          softNotes.push((metricLabel(metricKey) || metricKey) + " atlandı");
          console.warn("metric", metricKey, err);
          return {
            metric: metricKey,
            label: metricLabel(metricKey) || metricKey,
            series: [],
            total: null,
            total_mode: "sum",
            message: (err && err.message) || "",
            source: isVirgulMetric(metricKey) ? "virgul" : (isGa4Metric(metricKey) ? "ga4" : "asc")
          };
        });
      }));
      if (my !== runSeq) return;

      iaLastPrimaryMetric = selected.join(",");
      var primary = packs[0];
      iaLastChart = primary ? {
        metric: primary.metric,
        label: primary.label,
        series: primary.series || []
      } : null;

      if (packs.length === 1) {
        var mode = primary.total_mode || "sum";
        var seriesRows = primary.series || [];
        if (!seriesRows.length) {
          iaTotal.textContent = "—";
          iaTotalLabel.textContent = "Toplam / seçili";
        } else {
          iaTotal.textContent = fmtNum(primary.total, isCountLike(primary.metric));
          iaTotalLabel.textContent = mode === "last" ? "Son gün" : (mode === "avg" ? "Ortalama" : "Toplam / seçili");
        }
        iaCompareRange.textContent = primary.message || "";
      } else {
        iaTotal.textContent = String(packs.length);
        iaTotalLabel.textContent = "Seçili metrik";
        iaCompareRange.textContent = packs.length + " metrik · kendi ölçeği";
      }
      if (softNotes.length && iaStatus) {
        iaStatus.textContent = softNotes.slice(0, 3).join(" · ") +
          (softNotes.length > 3 ? (" · +" + (softNotes.length - 3)) : "");
      }
      renderSelectedBundles(packs);
    } catch (err) {
      if (err && err.name === "AbortError") return;
      if (my !== runSeq) return;
      if (iaStatus) iaStatus.textContent = (err && err.message) || "Yükleme hatası";
      iaChart.innerHTML = '<text x="360" y="130" text-anchor="middle" fill="#94a3b8" font-size="13">Veri yüklenemedi</text>';
      if (iaTotal) iaTotal.textContent = "—";
      if (iaCompareRange) iaCompareRange.textContent = "";
      iaLastChart = null;
      iaLastPrimaryMetric = "";
    } finally {
      if (my === runSeq) {
        iaBusy = false;
        setLoading(false);
      }
    }
  }

    function tone(pct) {
      if (pct == null || !isFinite(pct)) return "text-slate-800 dark:text-zinc-100";
      if (pct >= 99) return "text-emerald-600 dark:text-emerald-400";
      if (pct >= 95) return "text-amber-600 dark:text-amber-400";
      return "text-rose-600 dark:text-rose-400";
    }
    function card(title, sub, value, pct, extra) {
      return (
        '<div class="sf-card rounded-xl border border-slate-200 bg-slate-50/70 dark:border-zinc-700 dark:bg-zinc-950/40" title="' + esc([title, sub, extra].filter(Boolean).join(" · ")) + '">' +
          '<p class="sf-card__title font-bold uppercase tracking-wide text-slate-500 dark:text-zinc-400">' + esc(title) + "</p>" +
          (sub ? '<p class="sf-card__sub mt-0.5 text-slate-400">' + esc(sub) + "</p>" : "") +
          '<p class="sf-card__value font-extrabold tabular-nums ' + tone(pct) + '">' + esc(value || "—") + "</p>" +
          (extra ? '<p class="sf-card__extra mt-1 text-slate-500">' + extra + "</p>" : "") +
        "</div>"
      );
    }
    setLoading(true);
    fetch("/api/play-console/stability-free", { credentials: "same-origin", cache: "no-store" })
      .then(function (r) { return r.json(); })
      .then(function (data) {
        var plats = (data.crashlytics && data.crashlytics.platforms) || {};
        var ios = plats.ios || {};
        var cards = [];
        if (ios.latest && ios.latest.crash_free_fmt) {
          cards.push(card(
            "Crashlytics · v" + (ios.latest_version || ios.latest.version || "—"),
            "Latest version · 7d sessions",
            ios.latest.crash_free_fmt,
            ios.latest.crash_free_pct,
            ios.overall && ios.overall.crash_free_fmt ? ("all versions " + esc(ios.overall.crash_free_fmt)) : ""
          ));
        } else if (ios.overall && ios.overall.crash_free_fmt) {
          cards.push(card("Crashlytics", "All versions · 7d sessions", ios.overall.crash_free_fmt, ios.overall.crash_free_pct));
        }
        setLoading(false);
        if (!cards.length) {
          el.innerHTML = "";
          el.style.setProperty("--sf-n", "1");
          return;
        }
        var n = cards.length >= 4 ? 4 : Math.max(cards.length, 1);
        el.style.setProperty("--sf-n", String(n));
        el.innerHTML = cards.join("");
      })
      .catch(function () {
        setLoading(false);
        el.innerHTML = "";
      });
  })();
})();
</script>
{% endblock %}
